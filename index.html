<script id="bank" type="application/json">[{"s":0,"n":1,"p":2,"a":2,"q":"有關機器人的敘述下列何者正確？","o":["機器人沒有存在的必要。","機器人在生活之中完全無法應用。","機器人可取代重複性或有危險性的工作。","機器人並不能為人類帶來便利。"],"visual":false,"img":"images/q0.webp","explanation":"重複性工作可由程式反覆執行，危險作業則可降低人員暴露於危害的機會。"},{"s":0,"n":2,"p":2,"a":0,"q":"有關多手臂機器人敘述下列何者正確？","o":["多手臂機器人可以一次取多個貨物或一趟完成較多的事情，可以事半功倍。","多手臂機器人不但沒有任何優點，製造成本還較高。","多手臂機器人主要目的是為了降低風險，但效率較低。","多手臂機器人成本較單手臂機器人來的低。"],"visual":false,"img":"images/q1.webp","explanation":"多手臂能平行操作或協同取物，減少搬運往返次數。"},{"s":0,"n":3,"p":2,"a":1,"q":"若貨物需放在 20 公分高的貨櫃上，其手臂機構至少需要能上升多高？","o":["低於 20 公分","高於 20 公分","等於 20 公分","不必理會貨櫃高度。"],"visual":false,"img":"images/q2.webp","explanation":"夾取與放置需要通過櫃面，升高能力必須預留超過 20 cm 的間隙。"},{"s":0,"n":4,"p":2,"a":1,"q":"機器人 robot 一詞源自哪裡？","o":["日本科幻漫畫。","斯洛伐克劇本。","美國科幻作家艾西莫夫。","機器人之父-英格柏格論文。"],"visual":false,"img":"images/q3.webp","explanation":"robot 源自卡雷爾・恰佩克的捷克劇作 R.U.R.。題庫把地區寫為斯洛伐克，地理表述有疑義，判分依 B。"},{"s":0,"n":5,"p":2,"a":0,"q":"美國好萊塢電影凡是處理機器人的題材，總是會引用「機器人學三大法則」 ，以下哪一個不是三大法則？","o":["機器人因工作性質，可以傷害自己。","機器人必須保護自己。","機器人不得傷害人類。","機器人必須服從人類的命令。"],"visual":false,"img":"images/q4.webp","explanation":"三法則依序保護人類、服從命令與保護自身，題目 A 的任意傷害自己並非其中之一。"},{"s":0,"n":6,"p":2,"a":3,"q":"製作出第一台工業機器人 （Unimate）是哪一個國家？","o":["德國","日本","俄國","美國。"],"visual":false,"img":"images/q5.webp","explanation":"Unimate 在美國發展，並於美國汽車生產線投入使用。"},{"s":0,"n":7,"p":2,"a":1,"q":"世界上第一台雙足機器人是哪一個國家所發明的？","o":["德國","日本","美國","俄國。"],"visual":false,"img":"images/q6.webp","explanation":"早稻田大學的 WABOT 系列是日本早期雙足人形機器人的代表。"},{"s":0,"n":8,"p":2,"a":1,"q":"世界機器人博覽會 (又稱國際機器人展) 的英文簡稱為何？","o":["iRobot","iREX","TIRT","RoboCup。"],"visual":false,"img":"images/q7.webp","explanation":"iREX 指 International Robot Exhibition，日本國際機器人展。"},{"s":0,"n":9,"p":2,"a":0,"q":"ASIMO P3 可說是 21 世紀初智慧型人型機器人的代表作之一，設計與研發之公司為何？","o":["Honda","Sony","NEC","Mitsubishi。"],"visual":false,"img":"images/q8.webp","explanation":"ASIMO 與 P3 都屬 Honda 人形機器人發展系列，兩者是不同階段的機型。"},{"s":0,"n":10,"p":2,"a":2,"q":"娛樂機器人為目前機器人邁進家庭的途徑之一，下列哪一個機器人不是娛樂機器人？","o":["AIBO","Pleo","PUMA","Robo Sapien。"],"visual":false,"img":"images/q9.webp","explanation":"PUMA 是工業機械臂，典型用途為工業操作，與娛樂型機器人的定位不同。"},{"s":0,"n":11,"p":2,"a":2,"q":"樂高 （Lego）公司推出機器人 （EV3）套件，讓機器人可以像積木般組裝設計，請問它是哪一個國家的公司？","o":["美國","德國","丹麥","瑞典。"],"visual":false,"img":"images/q10.webp","explanation":"LEGO 創立於丹麥，EV3 是其機器人教育套件系列。"},{"s":0,"n":12,"p":3,"a":1,"q":"以下對 ASIMO P3 機器人的描述，何者為非？","o":["為一種人形雙足步行機器人。","可以呈現擬真的臉部表情。","與機器人三大定律的發明作家的姓名相似。","該機器人可勝任接待任務。"],"visual":false,"img":"images/q11.webp","explanation":"ASIMO 以步行和肢體動作為主，頭部外殼沒有擬真人臉表情的致動結構。"},{"s":0,"n":13,"p":3,"a":1,"q":"達文西機械手臂系統 （Da Vinci systems） ，以下何者為非？","o":["是手術輔助機器人。","具有傳統手術無法相比的穩定性、重現性與精確性，但因侵害性較大，有傷口較難癒合之後遺症。","醫生只要透過電腦操縱桿，即可精確的控制機械手臂。","融合機械手臂、電腦、醫師手技，透過小洞就可以進行心臟手術。"],"visual":false,"img":"images/q12.webp","explanation":"達文西系統主要用於微創手術，題目把侵入性和傷口癒合描述反了。"},{"s":0,"n":14,"p":3,"a":0,"q":"智慧型自走吸塵機器人 Roomba 曾經是世界上銷量最大，最商業化的家用清潔機器人。它是哪一家公司的產品？","o":["iRobot","Dr.Robot","Robot,Inc.","Robai。"],"visual":false,"img":"images/q13.webp","explanation":"Roomba 為 iRobot 推出的自走清掃機器人產品線。"},{"s":0,"n":15,"p":3,"a":0,"q":"工業用機器人與家用機器人之比較，下列何者不正確？","o":["兩者之應用場所相同。","家用機器人需要與人互動，必須具有視覺與聽覺等功能，工業機器人則可以不需要。","工業機器人為固定模式之重複性工作，家用機器人則屬於任務導向。","皆為取代或服務人類。"],"visual":false,"img":"images/q14.webp","explanation":"工業機器人常置於生產現場，家用機器人需適應家庭與人共處的環境。"},{"s":0,"n":16,"p":3,"a":1,"q":"工業機械手臂為自動化中的應用設備，其中哪一種機械臂的優點為動作靈活，允許任何旋轉運動？","o":["圓柱座標臂","關節座標臂","極座標臂","直角坐標臂。"],"visual":false,"img":"images/q15.webp","explanation":"關節型機械臂透過多個旋轉關節改變姿態，具有較靈活的方向控制能力。"},{"s":0,"n":17,"p":3,"a":2,"q":"最早利用 ZMP 來進行雙足步行的動態平衡步態分析，是哪一個單位的研究？","o":["HONDA","麻省理工學院 MIT","早稻田大學","大阪大學。"],"visual":false,"img":"images/q16.webp","explanation":"題庫將早期 ZMP 雙足步態應用研究對應早稻田大學。ZMP 概念本身與 Vukobratović 的研究密切相關。"},{"s":0,"n":18,"p":3,"a":1,"q":"AGV 是工廠常見的自動化裝置，它的中文名字常稱為？","o":["人型機器人。","無人搬運車。","仿生機器人。","手術機器人。"],"visual":false,"img":"images/q17.webp","explanation":"AGV 的 Automated Guided Vehicle 表示依導引路徑執行運輸的車輛。"},{"s":0,"n":19,"p":3,"a":1,"q":"輪行機器人與人形機器人之比較，以下何者為非？","o":["人型機器人由於外表特徵和人類相同，對地形與環境的適應性與泛用性較強。","輪型機器人機動性高，耗損能量少。","輪型機器人可荷載及裝配的設備較多。","人型機器人開發成本與技術門檻較高。"],"visual":false,"img":"images/q18.webp","explanation":"題庫選 B，但輪型平台在適合的平坦地面上通常確實較節能。本題「機動性」缺少地形條件，敘述有疑義。"},{"s":0,"n":20,"p":3,"a":0,"q":"在 20 世紀，台灣科幻作品的歷史上，漫畫作品《機器人》系列可說是空前絕後，是誰的作品？","o":["以《大嬸婆》成名的劉興欽。","以《老夫子》成名的王擇。","以《地球先鋒號》成名的黃鶯。","以《牛伯伯》成名的牛哥。"],"visual":false,"img":"images/q19.webp","explanation":"劉興欽除大嬸婆外，也以機器人題材漫畫著稱。"},{"s":0,"n":21,"p":4,"a":3,"q":"ZMP 是步態穩定控制的重要數據，當 ZMP 均落在腳掌範圍內，則機器人可以穩定行走，請問 ZMP 指的是？","o":["水平角度","前傾角度","反作用力","零力矩點。"],"visual":false,"img":"images/q20.webp","explanation":"零力矩點位於支撐多邊形內是常用的動態平衡判據，雙腳支撐時範圍可超出單一腳掌。"},{"s":0,"n":22,"p":4,"a":1,"q":"機器人 (robot) 一詞來自捷克語〝robota〞，其意義為？","o":["智慧生物","奴隸","夥伴","機器。"],"visual":false,"img":"images/q21.webp","explanation":"robota 與強制勞役、苦役相關，題庫以「奴隸」作對應。"},{"s":0,"n":23,"p":4,"a":1,"q":"機器人科幻電影《機械公敵》 (I, Robot) 的情節，衍生自誰的著作？","o":["手塚治蟲","艾西莫夫","英格伯格","恰佩克。"],"visual":false,"img":"images/q22.webp","explanation":"I, Robot 的名稱與機器人三法則設定源自艾西莫夫的作品。"},{"s":0,"n":24,"p":4,"a":2,"q":"工業機器人為目前機器人邁進產業的途徑之一，下列哪一個機器人為工業用機器人？","o":["AIBO","Pleo","PUMA","Robo Sapien。"],"visual":false,"img":"images/q23.webp","explanation":"PUMA 為可程式化工業操作手臂，適合重複性製造作業。"},{"s":0,"n":25,"p":4,"a":3,"q":"根據國際機器人聯盟 （International Federation of Robotics，IFR）的定義，以下何者為非？","o":["機器人可分為「工業用機器人」與「服務型機器人」兩大類。","工業用機器人主要運用在各種製造廠房中，多半以機械手臂為主，負責焊接、組裝、搬運、包裝等自動化生產工作，可提高效能與產值。","服務型機器人以保全、伴侶、醫療照護、家庭勞務、教育、休閒娛樂等方面為發展主軸。","工業用機器人是未來機器人產業的發展重點，將是推動全球經濟的成長引擎。"],"visual":false,"img":"images/q24.webp","explanation":"D 是產業發展預測，無法用來界定一台裝置是否符合工業機器人的技術定義。"},{"s":0,"n":26,"p":4,"a":0,"q":"台灣第一座機器人博物館，座落於哪一所大學內？","o":["台北城市科技大學","台灣科技大學","台灣大學","雲林科技大學。"],"visual":false,"img":"images/q25.webp","explanation":"這是題庫的歷史地點對應題，機器人博物館對應臺北城市科技大學。"},{"s":0,"n":27,"p":4,"a":3,"q":"微秒 （microsecond）是處理器計量速度的時間單位之一，1微秒等於？","o":["千分之一秒","十萬分之一秒","千萬分之一秒","百萬分之一秒。"],"visual":false,"img":"images/q26.webp","explanation":"micro 前綴代表 10⁻⁶，所以 1 μs＝0.000001 s。"},{"s":0,"n":28,"p":4,"a":3,"q":"製作出世界第一台工業機器人並成立世界上第一家工業機器人製造工廠，是哪一個國家？","o":["德國","日本","俄國","美國。"],"visual":false,"img":"images/q27.webp","explanation":"Unimation 與 Unimate 的起源在美國，工業機器人普及後日本才形成龐大的製造產業。"},{"s":0,"n":29,"p":4,"a":2,"q":"日本可說是「機器人王國」 ，特別是哪一年之後工業機器人帶動的科技發展，日本稱該年為「機器人元年」？","o":["1967","1973","1980","1983。"],"visual":false,"img":"images/q28.webp","explanation":"題庫以日本工業機器人快速普及的 1980 年為機器人元年。"},{"s":0,"n":30,"p":4,"a":2,"q":"Waseda 大學之 WF-4RIV 長笛演奏機器人，全身共有 41 個自由度，主要是提升吹長笛時手臂擬人化控制、用演奏音樂來傳達情感和交流，就像真人演奏家一樣。其中，喉部的設計是用什麼方式來模仿真人聲帶改變嗓門的波幅和頻率？","o":["控制氣流流量","吸吐氣","振動氣流","控制氣流速度。"],"visual":false,"img":"images/q29.webp","explanation":"以氣流振動模擬發聲與吹奏時的氣流變化，可調節振動幅度和頻率。"},{"s":0,"n":31,"p":4,"a":1,"q":"工業機械手臂為自動化中重要的應用設備，其中哪一種結構機械臂的優點為動作靈活，在產業應用中最為廣泛？","o":["圓柱臂","人形臂","極化臂","直角臂。"],"visual":false,"img":"images/q30.webp","explanation":"人形臂是關節型結構，旋轉關節可提供廣泛的工作姿態。"},{"s":0,"n":32,"p":4,"a":2,"q":"台灣第一座機器人夢工廠，為國內哪一家公司所成立？","o":["台灣積體電路製造股份有限公司","聯華電子股份有限公司","祥儀企業股份有限公司","鴻海科技集團。"],"visual":false,"img":"images/q31.webp","explanation":"祥儀企業以傳動機構為基礎發展機器人夢工廠。"},{"s":0,"n":33,"p":4,"a":3,"q":"下列何項非為智慧型機器人之基本硬體元件？","o":["動力源","致動器","控制器","吸塵裝置。"],"visual":false,"img":"images/q32.webp","explanation":"吸塵裝置屬特定應用的末端設備，許多智慧機器人完全不需要此裝置。"},{"s":0,"n":34,"p":5,"a":3,"q":"下列何項非為機器人致動器之能量來源？","o":["電力","液油壓","氣壓","人力。"],"visual":false,"img":"images/q33.webp","explanation":"機器人常見致動能源為電力、氣壓與液壓，題庫未把人工直接施力列為機器人致動能源。"},{"s":0,"n":35,"p":5,"a":0,"q":"下列何項為飛行機器人？","o":["HexaKopter","ACM-R 5","Spot","PackBot。"],"visual":false,"img":"images/q34.webp","explanation":"HexaKopter 是六旋翼飛行平台，透過旋翼升力飛行。"},{"s":0,"n":36,"p":5,"a":2,"q":"下列何項為足式機器人？","o":["HexaKopter","ACM-R 5","Spot","PackBot。"],"visual":false,"img":"images/q35.webp","explanation":"Spot 以四足步行，透過腿部關節適應地形。"},{"s":0,"n":37,"p":5,"a":3,"q":"下列何項為履帶式機器人？","o":["HexaKopter","ACM-R 5","Spot","PackBot。"],"visual":false,"img":"images/q36.webp","explanation":"PackBot 使用履帶，適合偵察與粗糙地面移動。"},{"s":0,"n":38,"p":5,"a":1,"q":"下列何項為水下機器人？","o":["HexaKopter","ACM-R 5","Spot","PackBot。"],"visual":false,"img":"images/q37.webp","explanation":"ACM-R5 為蛇形水下機器人，以身體擺動在水中運動。"},{"s":0,"n":39,"p":5,"a":1,"q":"輪型機器人是大多數普遍使用之運動機制，要保證移動機器人產生靜態穩定，則至少需要幾個輪子？","o":["2","3","4","5。"],"visual":false,"img":"images/q38.webp","explanation":"三個非共線接地點形成支撐面，重心投影在其內時可靜態穩定。"},{"s":0,"n":40,"p":5,"a":0,"q":"下列何項為輪式機器人？","o":["P3-DX","ACM-R 5","Spot","PackBot 。"],"visual":false,"img":"images/q39.webp","explanation":"P3-DX 是以輪子驅動的地面移動機器人平台。"},{"s":0,"n":41,"p":5,"a":2,"q":"國內最早開發保全機器人是何公司？","o":["中興保全公司","臺灣保全公司","新光保全公司","天威保全公司。"],"visual":false,"img":"images/q40.webp","explanation":"這是臺灣早期保全機器人發展的公司對應題，題庫對應新光保全。"},{"s":0,"n":42,"p":5,"a":3,"q":"下列選項何者非為足式運動機器人？","o":["Boston—Atlas","Honda—Asimo","KolLab--SandBot","Tesla—CyberCab。"],"visual":false,"img":"images/q41.webp","explanation":"CyberCab 屬輪型車輛，沒有以足部交替支撐和行走。"},{"s":0,"n":43,"p":5,"a":3,"q":"下列選項何者非為飛行運動機器人？","o":["Microdrones—md4-1000。","MicroKopter—HexaKopter。","Parrot—AR.Drone2.0。","ASIMO。"],"visual":false,"img":"images/q42.webp","explanation":"ASIMO 是雙足人形機器人，移動依靠腿部關節。"},{"s":0,"n":44,"p":5,"a":1,"q":"某次機器人競賽的題目，要搬運之物件分別為大物件 3 分、中物件 2 分、小物件 1 分，每種物件各有 3 個。我要組成 8 分 6 分 3 分，請問有幾種解法？","o":["3","4","5","6。"],"visual":false,"img":"images/q43.webp","explanation":"令每組的大中小物件數為 a、b、c，解 3a＋2b＋c＝各組分數，並限制三組合計各類不超過 3。列舉合法分配可得題庫的 4 組解。"},{"s":0,"n":45,"p":5,"a":3,"q":"某次機器人競賽的題目，要搬運之物件分別為大物件 3 分、中物件 2 分、小物件 1 分，每種物件各有 3 個。我要組成 7 分 6 分 3 分，且限制每組頂多為 3 個物件，請問有幾種解法？","o":["1","2","3","4。"],"visual":false,"img":"images/q44.webp","explanation":"逐組解 3a＋2b＋c＝7、6、3，再加上每組 a＋b＋c≤3 與各類總數≤3 的條件，列舉合法配置。"},{"s":0,"n":46,"p":5,"a":2,"q":"某次機器人競賽的題目，要搬運之物件分別為大物件 3 分、中物件 2 分、小物件 1 分，每種物件各有 3 個。我要組成 7 分，請問下列解法何者為正確？","o":["大物件 2 個、中物件 1 個、小物件 1 個。","大物件 1 個、中物件 2 個、小物件 1 個。","大物件 1 個、中物件 2 個、小物件 0 個。","大物件 1 個、中物件 1 個、小物件 3 個。"],"visual":false,"img":"images/q45.webp","explanation":"代入分數式 3×1＋2×2＋1×0＝7，符合目標分數。"},{"s":0,"n":47,"p":6,"a":3,"q":"某次機器人競賽的題目，要搬運之物件分別為大物件 3 分、中物件 2 分、小物件 1 分，每種物件各有 3 個，我要組成 7 分，請問下列解法何者為非？","o":["大物件 1 個、中物件 2 個、小物件 0 個。","大物件 2 個、中物件 0 個、小物 nternational Federation of Robotics 的縮寫。"},{"s":0,"n":93,"p":10,"a":2,"q":"工科技藝競賽機器人職種選手應準備工程筆記本。請問工程筆記本應記載的項目不包含下列哪一項？","o":["機器人本體機構設計","電路與電子系統設計","機器人外觀美化設計","目標物體取持機構設計。"],"visual":false,"img":"images/q92.webp","explanation":"工程筆記重點在設計、測試與改良依據，題庫未把單純外觀美化列為必要記錄。"},{"s":0,"n":94,"p":10,"a":1,"q":"有關於機器人設計過程的感測器運用之規劃與測試應記錄於工程筆記本的哪一項？","o":["機器人本體機構設計","電路與電子系統設計","機器人移動性能設計","目標物體取持機構設計。"],"visual":false,"img":"images/q93.webp","explanation":"感測器選型、接線與測試屬於電路與電子系統設計。"},{"s":0,"n":95,"p":10,"a":1,"q":"有關於機器人設計過程的線路整理規劃應記錄於工程筆記本的哪一項？","o":["機器人本體機構設計","電路與電子系統設計","機器人移動性能設計","目標物體取持機構設計。"],"visual":false,"img":"images/q94.webp","explanation":"線路整理涉及供電、信號干擾與接線可靠性，歸入電子系統設計。"},{"s":0,"n":96,"p":11,"a":3,"q":"有關於機器人設計過程的夾爪規劃應記錄於工程筆記本的哪一項？","o":["機器人本體機構設計","電路與電子系統設計","機器人移動性能設計","目標物體取持機構設計。"],"visual":false,"img":"images/q95.webp","explanation":"夾爪直接負責取持物體，歸入目標物體取持機構設計。"},{"s":0,"n":97,"p":11,"a":1,"q":"下列哪一項最不適合放入工程筆記本的程式思維設計單元中？","o":["夾取裝置的程式說明","夾具設計的工程圖","機器人控制信號運用的演算法","影像處理與夾具移動的資料流程圖。"],"visual":true,"img":"images/q96.webp","explanation":"夾具工程圖描述機械結構，應歸機構設計。程式思維單元主要記錄流程與演算法。"},{"s":0,"n":98,"p":11,"a":0,"q":"下列哪一項不是工科技藝競賽機器人職種的要求項目？","o":["參賽選手應將設計好的機器人在未拆解的情形下攜帶到現場再行拆解","機器人身上應設計把手方便搬運","機器人身上應設置緊急按鈕開關","機器人身上應設置狀態指示燈。"],"visual":false,"img":"images/q97.webp","explanation":"題庫要求依指定狀態攜帶零件並在現場組裝，A 描述完整機器人到場後再拆解，與其要求不符。"},{"s":0,"n":99,"p":11,"a":3,"q":"下列哪一項與工科技藝競賽機器人狀態指示燈的要求不符？","o":["待機時亮綠燈","機器人動作中亮橙燈","緊急按鈕開關按下時亮紅燈","只要 POWER ON 綠燈就必須要亮。"],"visual":false,"img":"images/q98.webp","explanation":"電源開啟與自主工作是不同狀態，指示燈需依規定顯示實際工作狀態。"},{"s":0,"n":100,"p":11,"a":3,"q":"下列哪一種積木為工科技藝競賽機器人職種指定使用的積木？","o":["Matrix","Studica","科技寶","以上都可以使用。"],"visual":false,"img":"images/q99.webp","explanation":"題庫列出的指定積木品牌皆可使用，仍需符合材料清單與機構件規範。"},{"s":0,"n":101,"p":11,"a":1,"q":"有關於工科技藝競賽機器人職種的機構件有何規定？","o":["限使用單一品牌積木構成","限使用指定品牌積木建構而成","可以使用伺服馬達與步進馬達","最多可以使用六個伺服馬達。"],"visual":false,"img":"images/q100.webp","explanation":"機構件要符合指定品牌積木規定，額外可使用的零件需依當年度公告確認。"},{"s":0,"n":102,"p":11,"a":0,"q":"為降低控制信號的干擾，下列何者為工科技藝競賽機器人職種所採取的措施？","o":["不得使用路由器或其他網路、通訊裝置","限使用 Wi-Fi 的遙控器","取消遙控的控制方式","每次僅一個場地進行遙控操作。"],"visual":false,"img":"images/q101.webp","explanation":"限制網路與通訊設備可降低現場無線干擾及外部通訊的可能。"},{"s":0,"n":103,"p":11,"a":2,"q":"為因應工科技藝競賽機器人職種眾多的參賽隊伍，在競賽現場共設置幾個場地同時進行競賽？","o":["四個","五個","六個","七個。"],"visual":false,"img":"images/q102.webp","explanation":"六個同時競賽場地為題庫設定的賽事配置，屬版本相關規格。"},{"s":0,"n":104,"p":11,"a":1,"q":"工科技藝競賽機器人職種在臉書有一個社群，參加成員有何限制？","o":["僅限選手與指導老師加入","回答指定問題並經審核通者可以加入","知道連結的都能加入","任何人都可加入。"],"visual":false,"img":"images/q103.webp","explanation":"社群以回答問題和審核確認加入資格，並非完全自由進入。"},{"s":0,"n":105,"p":11,"a":0,"q":"請問「無人飛行載具」的英文為何？","o":["Unmanned Aerial Vehicle (UA V)","Unmanned Ground Vehicle (UGV)","Unmanned Underwater Vehicle (UUV)","以上皆非。"],"visual":false,"img":"images/q104.webp","explanation":"UAV 中 Unmanned 表示無人，Aerial 表示空中，Vehicle 表示載具。"},{"s":0,"n":106,"p":11,"a":2,"q":"請問「無人水下載具」的英文為何？","o":["Unmanned Aerial Vehicle (UA V)","Unmanned Ground Vehicle (UGV)","Unmanned Underwater Vehicle (UUV)","以上皆非。"],"visual":false,"img":"images/q105.webp","explanation":"UUV 中 Underwater 表示水下，與 UAV 的 Aerial 區分。"},{"s":0,"n":107,"p":11,"a":3,"q":"機器人可協助或取代人類執行 3D 工作，請問 3D 工作不包含下列那個項目？","o":["污穢 Dirty","危險 Dangerous","嚴苛 Demanding","晦暗 Dark。"],"visual":false,"img":"images/q106.webp","explanation":"3D 常指 Dirty、Dull、Dangerous，也有以 Difficult 表述的版本，Dark 未列為此處的 3D。"},{"s":0,"n":108,"p":11,"a":3,"q":"下列何者不是仿生機器人的研究議題？","o":["模擬生物的功能","模擬生物的行為","模擬生物的智能","模擬生物的演化"],"visual":false,"img":"images/q107.webp","explanation":"仿生研究主要借用生物的結構、運動或感知機制。題庫把模擬生物演化列為非研究議題，但演化式機器人亦是存在的研究方向，題幹範圍較窄。"},{"s":0,"n":109,"p":12,"a":2,"q":"日本工業機器人協會(JIRA)對於機器人的分級，分為以下六級：  Class 1: Manual-Handling Device 手動裝置  Class 2: Fixed-Sequence Robot 固定程序機器人  Class 3: Variable-Sequence Robot 可變程序機器人  Class 4: Playback Robot 示教重現型機器人  Class 5: Numerical Control Robot 數值控制機器人  Class 6: Intelligent Robot 智慧機器人請問使用教導器由操作者教導後再重現執行程序的協作機器人可視為那一級？","o":["Class 2","Class 3","Class 4","Class 5。"],"visual":false,"img":"images/q108.webp","explanation":"先示教再重現動作符合 Playback Robot，即 Class 4。"},{"s":0,"n":110,"p":12,"a":2,"q":"北美地區最大的機器人組織為何？","o":["IFR, International Federation of Robotics","A3, Association for Advancing Automation","RIA, Robotic Industries Association","ISR, International Symposium of Robotics。"],"visual":false,"img":"images/q109.webp","explanation":"RIA 為題庫所指北美機器人產業組織的歷史名稱，現行組織名稱可能隨整併改變。"},{"s":0,"n":111,"p":12,"a":0,"q":"根據 RIA 在 2020 年發布的標準，有關 AMR (Autonomous Mobile Robot) 與 AGV (Automated  Guided Vehicle) 的敘述，下列何者不正確？","o":["AGV 在移動過程中遇有障礙物時會自動繞過障礙物","AGV 會遵循實體或虛擬的軌道導引機器人的運動","AMR 能夠根據環境即時規劃與調整移動路徑","AMR 主要是根據自我導航與定位技術。"],"visual":false,"img":"images/q110.webp","explanation":"傳統 AGV 遇到障礙通常停止，AMR 則常具備重新規劃與繞行能力。"},{"s":0,"n":112,"p":12,"a":1,"q":"下列何者不是國際機器人協會 (IFR) 的會員？","o":["China Robot Industry Alliance (CRIA)","Korean Robot Association (KRA)","Association for Advancing Automation (A3)","Taiwan Automation Intelligence and Robotics Association (TAIROA)。"],"visual":false,"img":"images/q111.webp","explanation":"本題依題庫列出的組織名稱辨識。協會會員名單可能變動，不能僅由名稱相近推論現行會員資格。"},{"s":0,"n":113,"p":12,"a":3,"q":"關於教導盒的描述，下列何者有誤？","o":["亦稱為教導面盤","為一種連接到控制系統之手持單元","可用來規劃或移動機器人","用於更改較優的控制法則，使機器人之響應狀態較為良好。"],"visual":false,"img":"images/q112.webp","explanation":"教導盒用於操作、示教及設定任務，設計或更換底層控制法則通常屬控制系統開發工作。"},{"s":0,"n":114,"p":12,"a":0,"q":"依據機器人研究學者 George A. Bekey 的定義：Robot is an entity that can sense, think and act.  機器人是一種具有感測功能，能夠運算和思考，進而產生對應動作的裝置。下列何者不屬於感測裝置？","o":["氣壓泵浦","雷射測距感測器","一氧化碳氣體感測器","攝影機。"],"visual":false,"img":"images/q113.webp","explanation":"氣壓泵浦提供動力，沒有把外界狀態轉成感測資訊的主要功能。"},{"s":0,"n":115,"p":12,"a":1,"q":"機器人是一種具有感測功能，能夠運算和思考的裝置，請問下列何種裝置較不適合應用於建構機器人的主要運算核心？","o":["筆記型電腦","可程式化邏輯控制器 PLC","單板電腦(樹莓派)","工業控制電腦。"],"visual":false,"img":"images/q114.webp","explanation":"題庫選 PLC，但 PLC 亦廣泛用於工業機器人系統。此題可理解為偏向需要較複雜自主運算的機器人情境，敘述有範圍限制。"},{"s":0,"n":116,"p":13,"a":0,"q":"人員照護機器人在設計與建造時，應確保設計之耐久性，不需考量下列哪一項目？","o":["製作成本","機械應力","振動","環境條件溫度與濕氣。"],"visual":false,"img":"images/q115.webp","explanation":"耐久性考量包括負載、磨耗與使用環境，製作成本屬經濟性要求。"},{"s":0,"n":117,"p":13,"a":2,"q":"請問下列何者不是移動機器人在自主移動時的主要問題？","o":["我在哪兒？","我周圍有什麼？","如何控制驅動機構？","如何到達目的地？"],"visual":false,"img":"images/q116.webp","explanation":"自主移動的典型高層問題為定位、建圖及路徑規劃。驅動控制屬較低層的執行工作。"},{"s":0,"n":118,"p":13,"a":0,"q":"機器人的構造多來自於模仿生物界的功能、智能和行為，以人體構造為類比，人體骨骼功能為組構支撐人體的骨架、保護內臟和產生動作。請問下列機器人的架構中，何者可等同於人體骨骼功能？","o":["機械模組","控制模組","傳感模組","能源模組。"],"visual":false,"img":"images/q117.webp","explanation":"機械模組提供支撐、連接與運動結構，對應人體骨骼。"},{"s":0,"n":119,"p":13,"a":1,"q":"機器人的構造多來自於模仿生物界的功能、智能和行為，以人體構造為類比，人體骨骼功能為組構支撐人體的骨架、保護內臟和產生動作。請問下列機器人的架構中，何者可等同於人體腦部功能？","o":["機械模組","控制模組","傳感模組","能源模組。"],"visual":false,"img":"images/q118.webp","explanation":"控制模組整合感測資訊並決策，對應腦部的控制功能。"},{"s":0,"n":120,"p":13,"a":2,"q":"機器人的構造多來自於模仿生物界的功能、智能和行為，以人體構造為類比，人體骨骼功能為組構支撐人體的骨架、保護內臟和產生動作。請問下列機器人的架構中，何者可等同於人體感官功能？","o":["機械模組","控制模組","傳感模組","能源模組。"],"visual":false,"img":"images/q119.webp","explanation":"傳感模組取得外界資訊，對應感官。"},{"s":0,"n":121,"p":13,"a":3,"q":"機器人的構造多來自於模仿生物界的功能、智能和行為，以人體構造為類比，人體骨骼功能為組構支撐人體的骨架、保護內臟和產生動作。請問下列機器人的架構中，何者可等同於人體進食以提供能量之功能？","o":["機械模組","控制模組","傳感模組","能源模組。"],"visual":false,"img":"images/q120.webp","explanation":"能源模組提供工作所需能量，對應攝取食物以供能。"},{"s":0,"n":122,"p":13,"a":0,"q":"ZMP 是移動機器人步態穩定控制的重要考量。請問 ZMP 是什麼的縮寫？","o":["Zero Moment Point","Zero Motion Point","Zero Moving Point","Zero Movement Point。"],"visual":false,"img":"images/q121.webp","explanation":"ZMP 展開為 Zero Moment Point，即零力矩點。"},{"s":0,"n":123,"p":13,"a":2,"q":"國際標準化組織( International Organization for Standard, ISO ) ISO 8373:2021 的機器人定義為： 「具有一定程度自主性以執行運動、操控或定位的可程式化驅動機構」。依據以上定義，請問有關機器人的敘述下列何者正確？","o":["機器人沒有自主性。","機器人無法修改程序以適應不同的應用任務。","機器人可自主移動或採用遙控方式執行任務。","機器人不能自主移動到某個地點。"],"visual":false,"img":"images/q122.webp","explanation":"依題庫定義判斷機器人的驅動、程式化及自主程度，實際機器人也可結合遙控與自主模式。"},{"s":0,"n":124,"p":13,"a":0,"q":"國際標準化組織( International Organization for Standard, ISO ) ISO 8373:2021 的工業機器人定義： 「可自動控制、重複設定、多功能、可操控之三軸以上機械手臂，在工業自動化應用裡能固定在一個地方或是移動平台上」 。依據以上定義，請問有關工業機器人的敘述下列何者正確？","o":["工業機器人可能固定在某個位置，也能夠架設在自主移動機器人上。","工業機器人只能採用人工示教方式來設定移動路徑。","工業機器人只能執行單一任務，無法更動控制程序。","工業機器人可以自主移動。"],"visual":false,"img":"images/q123.webp","explanation":"工業機械臂可固定安裝，也可裝在移動平台，安裝位置不會單獨決定其是否屬工業機器人。"},{"s":0,"n":125,"p":13,"a":1,"q":"打造一部醫療用機器人時，相對較少甚至不會利用以下何項科學？","o":["電機工程","藝術哲學","資訊工程","醫學工程。"],"visual":false,"img":"images/q124.webp","explanation":"醫療機器人直接整合機械、電機、資訊與醫學技術，藝術哲學相對較少是其核心工程需求。"},{"s":0,"n":126,"p":14,"a":0,"q":"打造一部移動型服務機器人時，電池管理系統 (Battery Management System, BMS) 技術會利用以下何項科學？","o":["電機工程","機械工程","醫學工程","語言學。"],"visual":false,"img":"images/q125.webp","explanation":"BMS 監測電壓、電流、溫度和電池保護狀態，核心屬電機與電子工程。"},{"s":1,"n":1,"p":15,"a":1,"q":"下列何種工具不適合應用在機器人活動關節上？","o":["防滑螺帽","鋸齒螺帽","快速插銷 (黑)","快速插銷 (白)。"],"visual":false,"img":"images/q126.webp","explanation":"鋸齒螺帽的齒面會咬住接觸面以防鬆，活動關節需要能順暢轉動，因此不適合。"},{"s":1,"n":2,"p":15,"a":0,"q":"王美第一次接觸機器人並不了解什麼是全向輪，請問下圖何者是全向輪？","o":[],"visual":true,"img":"images/q127.webp","explanation":"A 的小滾輪沿主輪外周排列，提供垂直於主滾動方向的被動移動能力。"},{"s":1,"n":3,"p":15,"a":1,"q":"李強第一次接觸機器人並不了解什麼是履帶輪，請問下圖何者是履帶輪？","o":[],"visual":true,"img":"images/q128.webp","explanation":"B 以連續帶狀構件包住多個輪子，接地面積較大，是履帶結構。"},{"s":1,"n":4,"p":15,"a":2,"q":"小明第一次接觸機器人並不了解什麼是萬向輪，請問下圖何者是萬向輪？","o":[],"visual":true,"img":"images/q129.webp","explanation":"依本題圖示，C 對應萬向輪。辨認時須看小滾輪的配置與軸向，名稱在教材間可能有差異。"},{"s":1,"n":5,"p":15,"a":3,"q":"小張第一次接觸機器人並不了解什麼是越野輪，請問下圖何者是越野輪？","o":[],"visual":true,"img":"images/q130.webp","explanation":"D 有較深且粗的胎紋，可增加鬆軟或不平地面的抓地能力。"},{"s":1,"n":6,"p":15,"a":3,"q":"若夾起貨物時，有機率性會從夾爪滑落，可在夾爪上增加下列何種材料來增加摩擦力？","o":["凡士林","A4 紙","潤滑油","砂紙。"],"visual":false,"img":"images/q131.webp","explanation":"砂紙提高接觸面的摩擦係數。在相同夾持正向力下，可提供更大的最大靜摩擦力，減少貨物滑落。"},{"s":1,"n":7,"p":15,"a":0,"q":"若原本夾緊的貨物卻會時常滑落，加上砂紙在金屬夾爪上即可以有效改善。主要原因為下列何者？","o":["摩擦力","精神力","超能力","地心引力。"],"visual":false,"img":"images/q132.webp","explanation":"砂紙提高接觸面的摩擦係數。在相同夾持正向力下，可提供更大的最大靜摩擦力，減少貨物滑落。"},{"s":1,"n":8,"p":15,"a":2,"q":"有關全向輪的敘述何者錯誤？","o":["可以在許多不同的方向進行移動。","可以像一個正常的車輪或使用滾輪的輥子側向滾動。","全向輪只能向前滾動，並不能側向滾動。","不只適用於在使用機器人，還可用於手推車，轉移輸送機，貨運車，行李等。"],"visual":false,"img":"images/q133.webp","explanation":"全向輪主輪負責前後主動滾動，周邊小滾輪允許側向被動移動。結合不同方向的驅動輪即可合成平面速度。"},{"s":1,"n":9,"p":15,"a":1,"q":"機器人所使用的輪子中，麥克納姆輪又稱為何種輪子？","o":["越野輪","萬向輪","全向輪","風火輪。"],"visual":false,"img":"images/q134.webp","explanation":"麥克納姆輪在輪周配置約 45° 的斜滾輪，轉動時可產生側向分力，題庫亦稱萬向輪。"},{"s":1,"n":10,"p":16,"a":0,"q":"下圖中的結構設計是利用哪種傳動？","o":["螺桿傳動","齒條齒輪傳動","履帶式傳動","動滑輪傳動。"],"visual":true,"img":"images/q135.webp","explanation":"螺桿旋轉帶動受導引的螺帽移動，把旋轉轉成直線運動。"},{"s":1,"n":11,"p":16,"a":3,"q":"下圖中的 Matrix 金屬鋁件其主要應用目的為？","o":["用於固定螺桿。","用於固定 DC Motor。","用於固定感測器。","用於固定 RC Servo。"],"visual":true,"img":"images/q136.webp","explanation":"圖中零件的安裝孔位與形狀對應 RC 伺服機固定座，用於承受伺服機反作用力。"},{"s":1,"n":12,"p":16,"a":1,"q":"有關齒條齒輪的傳動，下列敘述何者正確？","o":["齒輪齒條傳動是齒輪與齒輪配合的傳動方式。","當齒條主動時，可以將直線運動變成旋轉運動。","當齒輪主動時，可以將直線運動變成旋轉運動。","無法應用於上升下降使用。"],"visual":false,"img":"images/q137.webp","explanation":"齒條是直線排列的齒，齒輪是圓周排列的齒，兩者嚙合可相互轉換直線與旋轉運動。"},{"s":1,"n":13,"p":16,"a":3,"q":"全向輪有分成從動輪與主動輪，請問從動輪是在何種行動方式為主要移動？","o":["旋轉前進","旋轉後退","不動時","側向移動。"],"visual":false,"img":"images/q138.webp","explanation":"全向輪主輪負責前後主動滾動，周邊小滾輪允許側向被動移動。結合不同方向的驅動輪即可合成平面速度。"},{"s":1,"n":14,"p":16,"a":0,"q":"全向輪有分成從動輪與主動輪，請問主動輪是在何種行動方式為主要移動？","o":["旋轉前後","沒有用到","不動時","側向移動。"],"visual":false,"img":"images/q139.webp","explanation":"全向輪主輪負責前後主動滾動，周邊小滾輪允許側向被動移動。結合不同方向的驅動輪即可合成平面速度。"},{"s":1,"n":15,"p":16,"a":2,"q":"如果要完成機器人三輪全方向位移該選用何種輪子？","o":["麥克納姆輪","光頭胎","全向輪","一般輪子。"],"visual":false,"img":"images/q140.webp","explanation":"全向輪主輪負責前後主動滾動，周邊小滾輪允許側向被動移動。結合不同方向的驅動輪即可合成平面速度。"},{"s":1,"n":16,"p":16,"a":0,"q":"如果要完成機器人三輪全方向位移該如何安裝輪子的角度？","o":["三個輪子間距 120 度。","三個輪子間距 90 度。","三個輪子間距 50 度。","二個輪子間距 90 度。"],"visual":false,"img":"images/q141.webp","explanation":"三輪均分一周角度，360°÷3＝120°，形成對稱的全向驅動配置。"},{"s":1,"n":17,"p":16,"a":1,"q":"如果要完成機器人三輪全方向位移安裝輪子的角度何者錯誤？","o":["0、120、240","30、60、90","30、150、270","15、135、255。"],"visual":false,"img":"images/q142.webp","explanation":"30°、60°、90° 沒有形成均分一周的 120° 間隔，不符合本題的對稱三輪配置。"},{"s":1,"n":18,"p":17,"a":2,"q":"如果要完成機器人三輪全方向位移安裝輪子的角度何者正確？","o":["30、60、90","5、115、225","30、150、270","10、140、270。"],"visual":false,"img":"images/q143.webp","explanation":"150−30＝120，270−150＝120，跨越 360° 回到 30° 也相隔 120°。"},{"s":1,"n":19,"p":17,"a":0,"q":"有關下圖機器人底盤敘述何者正確？","o":["此圖中為四角型的機器人底盤。","此圖中為 45 度的三角機器人底盤。","此圖中為 60 度的三角機器人底盤。","圖中的底盤輪子只能裝上全向輪。"],"visual":true,"img":"images/q144.webp","explanation":"先看底盤外框與輪子安裝位置，題圖為四角配置，與三輪三角形底盤區分。"},{"s":1,"n":20,"p":17,"a":2,"q":"有關下圖機器人底盤之驅動輪為何？","o":["越野輪","麥克納姆輪","全向輪","一般輪子。"],"visual":true,"img":"images/q145.webp","explanation":"圖中輪周小滾輪提供側向自由度，屬全向輪配置。"},{"s":1,"n":21,"p":17,"a":2,"q":"有關下圖機器人底盤之驅動輪為何？","o":["全向輪","越野輪","麥克納姆輪","一般輪子。"],"visual":true,"img":"images/q146.webp","explanation":"辨認輪周斜置的滾輪，即可與普通輪和一般全向輪區分。"},{"s":1,"n":22,"p":17,"a":2,"q":"下列何者不是使用全向輪移動平台的優點？","o":["不需要旋轉即可以左右橫移。","360 度全方位移動且不用改變車身方向。","移動速度比較快。","可在狹窄的通道移動。"],"visual":false,"img":"images/q147.webp","explanation":"全向平台優勢是可側移與調整姿態，最高速度仍受馬達、傳動、輪徑與負載限制。"},{"s":1,"n":23,"p":18,"a":0,"q":"輪型機器人是大多數普遍使用之運動機制，要保證移動機器人產生靜態穩定，當具有四個以上輪子時，則需要設計什麼裝置？","o":["懸吊系統","煞車系統","減速系統","加速系統。"],"visual":false,"img":"images/q148.webp","explanation":"四個以上接地點遇到不平路面時可能有輪子懸空，懸吊可改善接地與負載分配。"},{"s":1,"n":24,"p":18,"a":3,"q":"一般所使用麥克納姆輪的輪轂軸與輥子轉軸的夾角為幾度？","o":["15","20","30","45 度。"],"visual":false,"img":"images/q149.webp","explanation":"麥克納姆輪在輪周配置約 45° 的斜滾輪，轉動時可產生側向分力，題庫亦稱萬向輪。"},{"s":1,"n":25,"p":18,"a":2,"q":"一般使用麥克納姆輪進行全向移動需安裝幾個輪子？","o":["2","3","4","5 個。"],"visual":false,"img":"images/q150.webp","explanation":"常見四輪麥克納姆平台以兩個左旋輪配兩個右旋輪，依指定方向配置後合成前後、側移與旋轉速度。"},{"s":1,"n":26,"p":18,"a":0,"q":"一般使用麥克納姆輪進行全向移動需安裝幾個左旋輪與右旋輪？","o":["2、2","1、3","0、4","3、1。"],"visual":false,"img":"images/q151.webp","explanation":"常見四輪麥克納姆平台以兩個左旋輪配兩個右旋輪，依指定方向配置後合成前後、側移與旋轉速度。"},{"s":1,"n":27,"p":18,"a":0,"q":"機器人在平坦表面上運動，使用何種驅動方式較為適合？","o":["輪式","履帶式","滑動式","螺旋槳推進式。"],"visual":false,"img":"images/q152.webp","explanation":"平坦地面適合輪式滾動，機構簡單且一般具有較低滾動阻力。"},{"s":1,"n":28,"p":18,"a":1,"q":"機器人在石子路上運動，使用何種驅動方式較為適合？","o":["輪式","履帶式","滑動式","螺旋槳推進式。"],"visual":false,"img":"images/q153.webp","explanation":"履帶以較大接地面積分散壓力，也能跨越小障礙，適合碎石與粗糙表面。"},{"s":1,"n":29,"p":18,"a":1,"q":"機器人在沙地表面上運動，使用何種驅動方式較為適合？","o":["全向輪式","越野輪式","萬向輪式","螺旋槳推進式。"],"visual":false,"img":"images/q154.webp","explanation":"題庫選越野輪，其胎紋有助於鬆軟地面抓地。實際沙地適用性仍取決於胎寬、接地壓力與沙況。"},{"s":1,"n":30,"p":18,"a":1,"q":"機器人在粗糙表面上運動，使用何種驅動方式較為適合？","o":["輪式","履帶式","滑動式","螺旋槳推進式。"],"visual":false,"img":"images/q155.webp","explanation":"履帶以較大接地面積分散壓力，也能跨越小障礙，適合碎石與粗糙表面。"},{"s":1,"n":31,"p":18,"a":0,"q":"機器人使用輪式或履帶式驅動方式，其優缺點之比較何項為錯？","o":["輪式原地轉彎能力較履帶式差。","輪式原地轉彎能力較履帶式好。","皆可使用差動式驅動。","輪式對地牽引力能力較履帶式差。"],"visual":false,"img":"images/q156.webp","explanation":"輪式平台亦可利用差速原地轉彎，不能概括認定其原地轉彎一定比履帶差。"},{"s":1,"n":32,"p":18,"a":0,"q":"那一種接受電子信號指令後能讓某種機構或系統產生特定運動的機構裝置？","o":["致動器","電動缸","氣壓缸","油壓缸。"],"visual":false,"img":"images/q157.webp","explanation":"致動器把電氣、氣壓或液壓能轉成機械動作，負責執行控制命令。"},{"s":1,"n":33,"p":18,"a":1,"q":"那一種組成是由一電動機與螺桿所結合之產品，當馬達旋轉時，螺桿上的螺帽機構會產生前進或後退的直線運動？","o":["致動器","電動缸","氣壓缸","油壓缸。"],"visual":false,"img":"images/q158.webp","explanation":"馬達帶動螺桿，螺帽受導引後沿軸線前後移動，形成電動缸。"},{"s":1,"n":34,"p":18,"a":2,"q":"那一種以氣體為驅動方式而產生直線運動之致動器？","o":["致動器","電動缸","氣壓缸","油壓缸。"],"visual":false,"img":"images/q159.webp","explanation":"氣壓缸利用壓縮空氣推動活塞，輸出直線位移和推力。"},{"s":1,"n":35,"p":18,"a":3,"q":"那一種以流體 （油） 為動力媒介 ， 透過密封容積的變化來傳遞動力 ， 而產生直線運動之致動器？","o":["致動器","電動缸","氣壓缸","油壓缸。"],"visual":false,"img":"images/q160.webp","explanation":"油壓缸利用受壓液體推動活塞，推力約為壓力乘活塞有效面積。"},{"s":1,"n":36,"p":18,"a":2,"q":"下列有關夾爪的敘述何者正確？","o":["夾爪的長度並不會影響力矩。","若兩個 RC Servor  （伺服馬達）在機構上互咬並不會造成損壞。","夾爪需依不同的情形或是不同的需求進行設計。","一隻夾爪只能有一個 RC Servor  （伺服馬達）。"],"visual":false,"img":"images/q161.webp","explanation":"工件形狀、材質、重量與抓取方向會改變夾爪的接觸面和所需夾持力。"},{"s":1,"n":37,"p":19,"a":2,"q":"針對球型工件之夾取，使用下列何種夾爪機構最適合？","o":["單爪機構夾爪","二爪機構夾爪","三爪機構夾爪","真空吸盤式夾爪。"],"visual":false,"img":"images/q162.webp","explanation":"三爪能從多方向包圍球體，較容易自定心與穩定定位。"},{"s":1,"n":38,"p":19,"a":2,"q":"下列何者不是常用之機械夾爪？","o":["吸附式取料手","兩指夾取式","仿生手指","以上皆為常用夾爪。"],"visual":false,"img":"images/q163.webp","explanation":"仿生手指屬多關節靈巧手，題庫將其與常見簡單機械夾爪分類區分。"},{"s":1,"n":39,"p":19,"a":1,"q":"車輛避震器上所應用之彈簧，其作用為？","o":["儲存能量","緩衝、吸收震動","測量力量","產生作用力。"],"visual":false,"img":"images/q164.webp","explanation":"彈簧變形可暫存能量，與阻尼器配合降低震動。彈簧本身主要儲能，能量耗散主要由阻尼完成。"},{"s":1,"n":40,"p":19,"a":1,"q":"兩彈簧之彈簧常數分別為 k1、k2，經並聯後之總彈簧常數為？","o":["k1 × k2","k1 ＋ k2","1 k1 +  1 k2","k1k2 k1+ k2。"],"visual":false,"img":"images/q165.webp","explanation":"並聯時兩彈簧位移相同，總力 F＝k1x＋k2x，因此等效剛度 k＝k1＋k2。"},{"s":1,"n":41,"p":19,"a":3,"q":"兩彈簧之彈簧常數分別為 k1、k2，經串聯後之總彈簧常數為？","o":["k1 × k2","k1 ＋ k2","1 k1 +  1 k2","k1k2 k1+ k2。"],"visual":false,"img":"images/q166.webp","explanation":"串聯時兩彈簧受力相同，總位移 x＝F/k1＋F/k2，因此 k＝k1k2/(k1＋k2)。"},{"s":1,"n":42,"p":19,"a":1,"q":"摩擦力與正向力間有什麼關係？","o":["成反比","成正比","平方成反比","平方成正比。"],"visual":false,"img":"images/q167.webp","explanation":"在庫侖摩擦模型下，最大靜摩擦力或動摩擦力與正向力成正比，比例常數為摩擦係數。"},{"s":1,"n":43,"p":19,"a":2,"q":"下圖為 DIP IC 頂視圖，試問標示為 D 的腳號為？","o":["第 1 腳","第 4 腳","第 5 腳","第 8 腳。"],"visual":true,"img":"images/q168.webp","explanation":"DIP 頂視圖以缺口或圓點辨認起點，再逆時針數腳位。本圖 B＝1、C＝4、D＝5、A＝8，圖中字母只是標記。"},{"s":1,"n":44,"p":19,"a":3,"q":"下圖為 DIP IC 頂視圖，試問標示為 A 的腳號為？","o":["第 1 腳","第 4 腳","第 5 腳","第 8 腳。"],"visual":true,"img":"images/q169.webp","explanation":"DIP 頂視圖以缺口或圓點辨認起點，再逆時針數腳位。本圖 B＝1、C＝4、D＝5、A＝8，圖中字母只是標記。"},{"s":1,"n":45,"p":19,"a":0,"q":"下圖為 DIP IC 頂視圖，試問標示為 B 的腳號為？","o":["第 1 腳","第 4 腳","第 5 腳","第 8 腳。"],"visual":true,"img":"images/q170.webp","explanation":"DIP 頂視圖以缺口或圓點辨認起點，再逆時針數腳位。本圖 B＝1、C＝4、D＝5、A＝8，圖中字母只是標記。"},{"s":1,"n":46,"p":19,"a":1,"q":"下圖為 DIP IC 頂視圖，試問標示為 C 的腳號為？","o":["第 1 腳","第 4 腳","第 5 腳","第 8 腳。"],"visual":true,"img":"images/q171.webp","explanation":"DIP 頂視圖以缺口或圓點辨認起點，再逆時針數腳位。本圖 B＝1、C＝4、D＝5、A＝8，圖中字母只是標記。"},{"s":1,"n":47,"p":20,"a":2,"q":"一般 LED、高亮度 LED 與超高亮度 LED 與下列何者有關？","o":["外加電壓大小","外加電壓頻率","材料能帶間隙","通過電流大小。"],"visual":false,"img":"images/q172.webp","explanation":"半導體材料的能帶結構影響發光波長及效率，亮度也受到晶片、封裝與驅動電流影響。"},{"s":1,"n":48,"p":20,"a":2,"q":"剛體的定義是？","o":["鋼鐵做的物體。","應力與應變成比例之物體。","物體內任兩點距離永不改變的物體。","受外力可變形但不致破壞之物體。"],"visual":false,"img":"images/q173.webp","explanation":"剛體是假設形變為零的理想模型，任兩點距離保持固定。"},{"s":1,"n":49,"p":20,"a":1,"q":"下列機械元件中可用於儲存、吸收能量及分離、結合機件者為？","o":["銷","彈簧","連桿","凸輪。"],"visual":false,"img":"images/q174.webp","explanation":"彈簧以彈性變形儲能，可用於回復、緩衝、壓緊與離合等機構。"},{"s":1,"n":50,"p":20,"a":1,"q":"有 4 個色環的電阻器，色碼前三碼是代表？","o":["電阻誤差值","電阻歐姆值","電阻功率","電阻精密度。"],"visual":false,"img":"images/q175.webp","explanation":"四環電阻的前兩環為有效數字，第三環為倍率，三者共同決定標稱電阻。"},{"s":1,"n":51,"p":20,"a":0,"q":"有 4 個色環的電阻器，色碼最後一碼是代表？","o":["電阻誤差值","電阻歐姆值","電阻功率","電阻精密度。"],"visual":false,"img":"images/q176.webp","explanation":"四環電阻最後一環為容許誤差，例如金色 ±5%、銀色 ±10%。"},{"s":1,"n":52,"p":20,"a":0,"q":"橙白紅金紅的精密電阻值為？","o":["39.2±2% 歐姆","47.2±2% 歐姆","392±2% 歐姆","472±2% 歐姆。"],"visual":false,"img":"images/q177.webp","explanation":"五環讀法為橙白紅＝392，金＝×0.1，紅＝±2%，得到 39.2 Ω±2%。"},{"s":1,"n":53,"p":20,"a":3,"q":"一般數字式三用電表 AC 檔所測得之數值是指被測正弦波信號之？","o":["最大值","峰值","峰對峰值","均方根 (rms) 值。"],"visual":false,"img":"images/q178.webp","explanation":"正弦交流電的有效值等於可產生相同平均熱功率的直流值，即 RMS 值。"},{"s":1,"n":54,"p":20,"a":0,"q":"當溫度升高時，一般金屬導體之電阻值會增加，而矽半導體在溫度上升時，其電阻值？","o":["下降","上升","不變","成絕緣體。"],"visual":false,"img":"images/q179.webp","explanation":"一般本質半導體升溫後載子增加，導電能力提高，因此電阻通常下降。"},{"s":1,"n":55,"p":20,"a":0,"q":"電容的電氣特性是？","o":["以電場儲存能量","以磁場儲存能量","將電能轉換成磁能","將磁能轉換成電能。"],"visual":false,"img":"images/q180.webp","explanation":"電容儲存電荷並建立電場，儲能 E＝CV²/2。"},{"s":1,"n":56,"p":20,"a":2,"q":"電容器是在兩導體之間以下列何者填充所組成？","o":["第三種導體","半導體","絕緣體","導體材質。"],"visual":false,"img":"images/q181.webp","explanation":"介電質隔開兩導體，避免直接導通，同時影響電容量。"},{"s":1,"n":57,"p":20,"a":1,"q":"電容器在兩導體間的介質增厚時，電容值？","o":["變大","變小","不變","不一定。"],"visual":false,"img":"images/q182.webp","explanation":"平行板電容 C＝εA/d，介質厚度 d 增加，電容量下降。"},{"s":1,"n":58,"p":20,"a":0,"q":"麥拉（Mylar）電容器上標示 473 K 則其電容量為？","o":["0.047μF±10%","0.047μF±5%","0.47μF±10%","0.47μF±5%。"],"visual":false,"img":"images/q183.webp","explanation":"473＝47×10³ pF＝47000 pF＝0.047 μF，K 表示 ±10%。"},{"s":1,"n":59,"p":20,"a":3,"q":"在電路中，電阻有以下哪種功能？","o":["在直流電路中阻擋交流信號。","在交流電路中阻擋直流信號。","在電路中增大電流量。","在固定電壓下限制電流量。"],"visual":false,"img":"images/q184.webp","explanation":"固定電壓下 I＝V/R，串入電阻會限制電流，也會消耗功率。"},{"s":1,"n":60,"p":20,"a":1,"q":"負溫度係數的熱敏電阻，其電阻值會隨溫度上升而？","o":["增加","減少","不變","不一定。"],"visual":false,"img":"images/q185.webp","explanation":"NTC 為負溫度係數，溫度升高時阻值下降。"},{"s":1,"n":61,"p":21,"a":0,"q":"正溫度係數的熱敏電阻，其電阻值會隨溫度上升而？","o":["增加","減少","不變","不一定。"],"visual":false,"img":"images/q186.webp","explanation":"PTC 為正溫度係數，溫度升高時阻值增加。"},{"s":1,"n":62,"p":21,"a":2,"q":"當齊納二極體 (Zener diode) 正常工作時，應該是工作在？","o":["電壓為 0","電流為 0","逆向偏壓","順向偏壓。"],"visual":false,"img":"images/q187.webp","explanation":"齊納二極體利用逆向崩潰區的近似固定電壓穩壓，需搭配限流。"},{"s":1,"n":63,"p":21,"a":1,"q":"P 型半導體的多數載子為？","o":["自由電子","電洞","施體原子","受體原子。"],"visual":false,"img":"images/q188.webp","explanation":"P 型半導體摻入受體雜質，多數載子是電洞。"},{"s":1,"n":64,"p":21,"a":0,"q":"在 P 型半導體中，電洞的移動是依賴？","o":["電子移動","電洞本身移動","施體原子移動","受體原子移動。"],"visual":false,"img":"images/q189.webp","explanation":"鄰近價電子填入電洞後，在原位置留下新的電洞，看起來如電洞朝反方向移動。"},{"s":1,"n":65,"p":21,"a":0,"q":"理想運算放大器的輸入阻抗是？","o":["無窮大","10 kΩ","1 Ω","0 Ω。"],"visual":false,"img":"images/q190.webp","explanation":"理想運放輸入電流為零，因此輸入阻抗視為無窮大。"},{"s":1,"n":66,"p":21,"a":3,"q":"理想運算放大器的輸出阻抗是？","o":["無窮大","10 kΩ","1 Ω","0 Ω。"],"visual":false,"img":"images/q191.webp","explanation":"理想運放輸出如理想電壓源，輸出阻抗為零。"},{"s":1,"n":67,"p":21,"a":2,"q":"一般矽質電晶體工作於動作區時，基極與射極間的電壓 VBE 大約是？","o":["0.1 V","0.2 V","0.7 V","2 V。"],"visual":false,"img":"images/q192.webp","explanation":"矽 BJT 正向導通的基極—射極接面常近似為 0.7 V，實際值依電流與溫度改變。"},{"s":1,"n":68,"p":21,"a":3,"q":"二極體不能達成下列哪一種電路功能？","o":["整流","檢波","截波","放大。"],"visual":false,"img":"images/q193.webp","explanation":"一般二極體可整流、限幅和箝位，沒有一般電晶體式的功率增益功能。"},{"s":1,"n":69,"p":21,"a":2,"q":"AC 110 V/60 Hz 的交流電經過全波整流後，輸出的頻率是？","o":["30 Hz","60 Hz","120 Hz","90 Hz。"],"visual":false,"img":"images/q194.webp","explanation":"全波整流將正、負半週都翻成同極性，每個交流週期產生兩個脈動，所以 2×60＝120 Hz。"},{"s":1,"n":70,"p":21,"a":2,"q":"AC110 V/60 Hz 的交流電經過全波整流後，輸出的峰值電壓大約是？","o":["110 V","120 V","156 V","220 V。"],"visual":false,"img":"images/q195.webp","explanation":"正弦峰值＝有效值×√2＝110×1.414≈155.6 V，忽略整流壓降約 156 V。"},{"s":1,"n":71,"p":21,"a":3,"q":"下圖為穩壓 IC 78XX 系列中之 TO-220 型的外觀及腳編號圖，其 （輸入端，輸出端）的腳號應為？","o":["（3，1）","（2，3）","（2，1）","（1，2）。"],"visual":true,"img":"images/q196.webp","explanation":"判分必須依題圖的自訂編號。常見 78XX TO-220 原廠腳位為 1 輸入、2 接地、3 輸出，本題答案的 (1,2) 不能直接當成實際封裝接線。","source":"https://www.ti.com/lit/ds/symlink/lm7800.pdf"},{"s":1,"n":72,"p":21,"a":1,"q":"有一馬達效率為 80%，輸入功率為 1865 瓦特，則其輸出馬力數為多少？ （註：1 馬力=746 瓦特）","o":["1.8","2","2.2","1492。"],"visual":false,"img":"images/q197.webp","explanation":"輸出功率＝1865×0.8＝1492 W，再除以 746 W/HP，得到 2 HP。"},{"s":1,"n":73,"p":21,"a":0,"q":"功率電晶體 3955 的集極和金屬外殼接在一起，主要是為了？","o":["增加散熱面積","一體成型外觀美","方便外接電線","容易識別集極。"],"visual":false,"img":"images/q198.webp","explanation":"金屬外殼可把接面熱傳到較大散熱面，降低熱阻，但安裝時也要注意外殼的電位與絕緣。"},{"s":1,"n":74,"p":21,"a":2,"q":"可提供穩定電壓效果的二極體為？","o":["發光二極體","變容二極體","齊納二極體","光電二極體。"],"visual":false,"img":"images/q199.webp","explanation":"齊納二極體利用逆向崩潰區的近似固定電壓穩壓，需搭配限流。"},{"s":1,"n":75,"p":22,"a":3,"q":"下列何項非為常用之直線式致動器？","o":["電動缸","液油壓缸","氣壓缸","RC 馬達。"],"visual":false,"img":"images/q200.webp","explanation":"RC 馬達通常直接輸出旋轉，須搭配傳動機構才轉成直線運動。"},{"s":1,"n":76,"p":22,"a":0,"q":"若機器人的電池組使用容量為 1200mAh 的 3 號（AA）鎳氫電池 6 顆串聯而成，試問電池組可提供多少電壓？","o":["7.2 V","8.4 V","9 V","12 V。"],"visual":false,"img":"images/q201.webp","explanation":"鎳氫電池標稱 1.2 V，六顆串聯電壓相加為 7.2 V，容量仍約 1200 mAh。"},{"s":1,"n":77,"p":22,"a":2,"q":"關於市面上常見電池的敘述何者錯誤？","o":["鎳氫電池有較嚴重的記憶效應。","鎳氫電池容易自放電。","鋰電池不可充電。","單顆鋰電池的額定電壓約 3 V。"],"visual":false,"img":"images/q202.webp","explanation":"一次鋰電池與可充電鋰離子電池是不同種類，不能概括稱所有鋰電池都不可充電。"},{"s":1,"n":78,"p":22,"a":1,"q":"在直接驅動馬達中，若要控制馬達扭力可調整下列何者？","o":["電壓","電流","電阻","電感。"],"visual":false,"img":"images/q203.webp","explanation":"直流馬達轉矩約與電樞電流成正比，T＝KtI。"},{"s":1,"n":79,"p":22,"a":0,"q":"在直接驅動馬達中，若要控制馬達轉速可調整下列何者？","o":["電壓","電流","電阻","電感。"],"visual":false,"img":"images/q204.webp","explanation":"固定磁通下馬達反電動勢與轉速成正比，改變施加電壓可調整穩態轉速。"},{"s":1,"n":80,"p":22,"a":2,"q":"在伺服馬達的脈波指令的位置控制中，下面哪一種不屬於通用的脈波指令？","o":["脈波/方向","CW/CCW 脈波列","階梯型脈波列","A/B 相脈波列。"],"visual":false,"img":"images/q205.webp","explanation":"常見位置脈波介面包含脈波＋方向、正反向雙脈波及相位差脈波，階梯型脈波不是這裡的通用編碼方式。"},{"s":1,"n":81,"p":22,"a":2,"q":"關於步進馬達之特徵，下列何者為非？","o":["能透過電腦以數位訊號控制。","定位時，所產生的誤差不會累積。","靜止時，無法保持轉矩。","壽命較長。"],"visual":false,"img":"images/q206.webp","explanation":"停止步進脈波但維持激磁時，轉子可保持在目前位置並提供保持轉矩。"},{"s":1,"n":82,"p":22,"a":3,"q":"為了使電機系統達到高精度之定位，通常會採用何種控制？","o":["程式控制","順序控制","開迴路控制","閉迴路控制。"],"visual":false,"img":"images/q207.webp","explanation":"閉迴路由位置或速度回授計算誤差，修正擾動與負載造成的偏移。"},{"s":1,"n":83,"p":22,"a":3,"q":"馬達使用減速機之目的，下列何者正確？","o":["降低輸入電流","降低輸入電壓","提高傳動效率","提高輸出轉矩。"],"visual":false,"img":"images/q208.webp","explanation":"減速機把馬達高轉速換成較低輸出轉速，理想情況下轉矩按減速比放大，實際還有傳動損失。"},{"s":1,"n":84,"p":22,"a":2,"q":"旋轉馬達配合減速齒輪組使用，目的是在於？","o":["提高轉速增加轉矩。","提高轉速降低轉矩。","降低轉速增大轉矩。","降低轉速降低轉矩。"],"visual":false,"img":"images/q209.webp","explanation":"減速機把馬達高轉速換成較低輸出轉速，理想情況下轉矩按減速比放大，實際還有傳動損失。"},{"s":1,"n":85,"p":22,"a":3,"q":"步進馬達停止脈波輸入時，下列敘述何者是正確的？","o":["轉子可自由的被轉動。","轉子會轉回啟動時的位置。","轉子會繼續轉動。","轉子會停止，並保持在目前的位置。"],"visual":false,"img":"images/q210.webp","explanation":"停止步進脈波但維持激磁時，轉子可保持在目前位置並提供保持轉矩。"},{"s":1,"n":86,"p":22,"a":2,"q":"下列何種馬達的轉子是做直線型運動？","o":["步進馬達","同步馬達","線性馬達","交流感應馬達。"],"visual":false,"img":"images/q211.webp","explanation":"線性馬達沿直線直接產生電磁推力，不需先輸出旋轉再轉成直線。"},{"s":1,"n":87,"p":23,"a":1,"q":"在裝設馬達時常會與軸承搭配使用，下列有關於軸承的用途何者是錯誤的？","o":["增加傳動效率。","增大轉子的轉動慣量。","減低轉軸摩擦。","保持軸的軸心位置。"],"visual":false,"img":"images/q212.webp","explanation":"軸承支撐軸並減少摩擦，增加轉動慣量不是主要用途。"},{"s":1,"n":88,"p":23,"a":3,"q":"關於步進馬達的敘述，下列何者是錯誤的？","o":["輸入的脈波數越多，其轉動角度越大。","有角度累積誤差。","位置控制可不需要位置回授。","步進馬達激磁停止時，轉子不具有保持力。"],"visual":false,"img":"images/q213.webp","explanation":"題庫答案有疑義。停止輸入步進脈波並保持激磁仍有保持轉矩，若「激磁停止」意指斷電，保持力會大幅下降，仍可能有定位轉矩。"},{"s":1,"n":89,"p":23,"a":2,"q":"關於步進馬達的敘述、下列何者是正確的？","o":["若輸入的連續脈衝停止時，轉子會以等速繼續轉動。","轉速與輸入脈波的振幅成正比。","可以對步進馬達轉速進行控制。","負載過大時不會產生失步的現象。"],"visual":false,"img":"images/q214.webp","explanation":"步進馬達轉速由每秒輸入脈波數乘每步角度決定，因此可以調速。"},{"s":1,"n":90,"p":23,"a":0,"q":"選擇馬達之性能主要的考慮因素不包括？","o":["安裝方式","額定功率","運轉速度","運轉扭矩啟動扭矩。"],"visual":false,"img":"images/q215.webp","explanation":"性能選型先滿足負載轉矩、轉速、功率與工作週期等需求，再考慮安裝與價格。"},{"s":1,"n":91,"p":23,"a":1,"q":"機器人使用直流馬達控制時，可以使用下列何種驅動元件？","o":["LM318","FT5754","LM7912","LM7824。"],"visual":false,"img":"images/q216.webp","explanation":"FT5754 在本題列為直流馬達驅動元件，控制器透過驅動級供應馬達所需電流。"},{"s":1,"n":92,"p":23,"a":2,"q":"有關直流伺服馬達，下列何者為誤？","o":["可分為有刷及無刷馬達。","所產生之力矩與電樞電流成正比。","轉速越高力矩越大。","轉速越高力矩越小。"],"visual":false,"img":"images/q217.webp","explanation":"常見直流馬達在固定電壓下，轉速升高時可用轉矩通常降低，不能說轉速越高力矩越大。"},{"s":1,"n":93,"p":23,"a":0,"q":"改變齒輪比是用來？","o":["增速，減速","沒作用","傳動大馬力","改變運動方向。"],"visual":false,"img":"images/q218.webp","explanation":"輸入與輸出齒數比決定轉速比，可設計為增速或減速。"},{"s":1,"n":94,"p":23,"a":2,"q":"在齒輪系中設置惰輪，目的為何？","o":["改變減速比","增加傳動效率","改變轉動方向","減少齒輪干涉現象。"],"visual":false,"img":"images/q219.webp","explanation":"單純惰輪可改變最後轉向及軸距配置，總速比主要仍由首末齒輪齒數決定。"},{"s":1,"n":95,"p":23,"a":2,"q":"關於齒輪若要正確嚙合傳動，該選用何種基本參數相同的齒輪？","o":["節圓直徑 （Pitch circle diameter）","齒數","週節","齒輪軸向厚度。"],"visual":false,"img":"images/q220.webp","explanation":"嚙合齒輪需具相同週節，並要配合模數、壓力角等參數，才能正常接觸傳動。"},{"s":1,"n":96,"p":23,"a":2,"q":"彈簧為常用機械原件，何者不是彈簧的用途？","o":["作為能量來源","防止震動","保持運動速度","吸收碰撞能量。"],"visual":false,"img":"images/q221.webp","explanation":"彈簧提供與變形成比例的力，本身不具固定速度的調節能力。"},{"s":1,"n":97,"p":23,"a":1,"q":"在機器人的組成機構中，有一常用的傳動裝置，係通過一定的傳動比透過齒輪傳動裝置，將電機的高轉速降低為機械裝置所能適應的較低速度。請問上述的機構描述的為下列何者？","o":["聯軸器","減速器","加速器","制動器。"],"visual":false,"img":"images/q222.webp","explanation":"減速機把馬達高轉速換成較低輸出轉速，理想情況下轉矩按減速比放大，實際還有傳動損失。"},{"s":1,"n":98,"p":23,"a":0,"q":"齒輪為傳動系統上常用的機構之一。下列哪一個齒輪組輸入軸和輸出軸的方向必不同？","o":["傘齒輪","行星齒輪","正齒輪","斜齒輪。"],"visual":false,"img":"images/q223.webp","explanation":"傘齒輪用於相交軸傳動，輸入輸出軸方向不同。"},{"s":1,"n":99,"p":24,"a":0,"q":"下列何者不列入選擇馬達時的首要考慮因素？","o":["馬達價格","運轉及啟動相時的電流限制","馬達啟動與停止的頻率如何","預期的負荷變動及容許之對應速度變動。"],"visual":false,"img":"images/q224.webp","explanation":"性能選型先滿足負載轉矩、轉速、功率與工作週期等需求，再考慮安裝與價格。"},{"s":1,"n":100,"p":24,"a":2,"q":"三個齒輪排成一排且兩兩相連，且三個齒輪的齒數依序為 40 齒、24 齒、32 齒。請問第一個齒輪順時針方向轉動一圈時，第三個齒輪以什麼方向轉動多少圈？","o":["順時針方向轉動 0.8 圈","逆時針方向轉動 0.8 圈","順時針方向轉動 1.25 圈","逆時針方向轉動 1.25 圈。"],"visual":false,"img":"images/q225.webp","explanation":"兩次外嚙合後首末同向，圈數＝40/32＝1.25，故第三輪順時針 1.25 圈。"},{"s":1,"n":101,"p":24,"a":1,"q":"三個齒輪排成一排且兩兩相連，且三個齒輪的齒數依序為 28 齒、21 齒、35 齒。請問第一個齒輪逆時針方向轉動一圈時，第三個齒輪以什麼方向轉動多少圈？","o":["順時針方向轉動 0.8 圈","逆時針方向轉動 0.8 圈","順時針方向轉動 1.25 圈","逆時針方向轉動 1.25 圈。"],"visual":false,"img":"images/q226.webp","explanation":"兩次外嚙合後首末同向，圈數＝28/35＝0.8，故第三輪逆時針 0.8 圈。"},{"s":1,"n":102,"p":24,"a":0,"q":"常見於自動堆高機平台的「單轉向輪(Steer Drive)」底盤機構中，如下圖所示，請問轉向輪 (Steer Wheel)在哪一輪？","o":["前輪","右後輪","左後輪","以上皆是。"],"visual":true,"img":"images/q227.webp","explanation":"單轉向驅動輪將轉向和驅動整合於同一輪組，本題圖示設在前輪。"},{"s":1,"n":103,"p":24,"a":0,"q":"常見於自動堆高機平台的「單轉向輪(Steer Drive)」底盤機構中，如下圖所示，請問驅動輪 (Drive Wheel)在哪一輪？","o":["前輪","右後輪","左後輪","以上皆是。"],"visual":true,"img":"images/q228.webp","explanation":"單轉向驅動輪將轉向和驅動整合於同一輪組，本題圖示設在前輪。"},{"s":1,"n":104,"p":24,"a":2,"q":"移動機器人可採用遙控、自主或半自主等方式進行移動，請問下列何者適用於陸地上的移動方式？","o":["螺旋槳推進式","水噴射式","越野輪式","翅膀拍動式。"],"visual":false,"img":"images/q229.webp","explanation":"越野輪以地面接觸提供牽引，適合陸地移動。"},{"s":1,"n":105,"p":24,"a":3,"q":"機器人組成架構可分為機械模組、傳感模組、控制模組等三大模組和能源系統，請問下列何者屬於機械模組？","o":["感知系統","控制系統","人機互動系統","機械結構系統。"],"visual":false,"img":"images/q230.webp","explanation":"機械模組負責支撐與運動，機械結構系統對應人體骨骼。"},{"s":1,"n":106,"p":25,"a":0,"q":"機器人組成架構可分為機械模組、傳感模組、控制模組等三大模組和能源系統，請問機械模組可類比於下列哪一種人體構造？","o":["骨骼結構","眼耳鼻舌身等感官","大腦","神經系統。"],"visual":false,"img":"images/q231.webp","explanation":"機械模組負責支撐與運動，機械結構系統對應人體骨骼。"},{"s":1,"n":107,"p":25,"a":0,"q":"下列何者為液壓系統夾爪的優點？","o":["驅動過程平順","低成本","噪音大","速度快。"],"visual":false,"img":"images/q232.webp","explanation":"液壓可提供較大、較平順的推力，夾持力由壓力和有效面積決定。"},{"s":1,"n":108,"p":25,"a":0,"q":"下列關於有刷直流馬達的 PWM 驅動原理之敘述，何者錯誤？","o":["當 PWM 控制信號處於高電位(On)時，將對馬達外加電壓。","當 PWM 控制信號處於低電位(Off)時，馬達引腳的兩端將短路。","當 PWM 控制信號處於低電位(Off)時，線圈的電感會釋放所儲存的磁能，提供保持電流的作用。","當 PWM 控制信號處於低電位(Off)時，在相對於電感 L 和電阻 R 的時間常數足夠短的週期內，反覆外加電壓並且馬達兩端反覆短路時(即 PWM 控制信號持續作用)，流過的電流無法視為定值。。"],"visual":true,"img":"images/q233.webp","explanation":"題庫選 A，但對一般主動高電位 PWM 而言，ON 時施壓是成立的。是否高電位導通需由驅動器極性與電路判斷，本題缺少此條件。"},{"s":1,"n":109,"p":25,"a":0,"q":"馬達能量轉換過程遵循能量守恆定律，旋轉運動之能量(W) = 轉矩 (T) × 轉速 ()。依據以上公式，若馬達經過一個齒輪箱，其中轉矩輸入齒輪半徑為 ri，輸入轉矩為 Ti，能量為 Wi；轉矩輸出齒輪半徑為 ro，輸出轉矩為 To，能量為 Wo。請問以下敘述何者正確？","o":["若 ri > ro，則 Ti > To","若 ri > ro，則 Ti \u003c To","若 ri \u003c ro，則 Wi \u003c Wo","若 Ti \u003c To，則 Wi \u003c Wo。"],"visual":false,"img":"images/q234.webp","explanation":"相同齒面切向力 F 下 T＝Fr，所以 ri>ro 時 Ti>To。題幹的 T×角速度實為功率，能量應再對時間積分。"},{"s":1,"n":110,"p":25,"a":3,"q":"有刷直流馬達具有兩個電源端子，透過在這兩個端子上外加電壓以驅動馬達。兩個端子可以透過「H 橋電路」四個切換開關的電路來實現四種連接組合。圖(1)中透過將 SW1～SW4 全部 OFF 來實現，此時馬達的運作狀態為？","o":["正轉","反轉","循環正反轉","停止。"],"visual":true,"img":"images/q235.webp","explanation":"四開關皆 OFF 時不再主動供電，馬達可自由滑行，題庫以停止表示此控制狀態。"},{"s":1,"n":111,"p":26,"a":0,"q":"有刷直流馬達具有兩個電源端子，透過在這兩個端子上外加電壓以驅動馬達。兩個端子可以透過「H 橋電路」四個切換開關的電路來實現四種連接組合。圖(2)中透過將 SW1、SW4 ON， SW2、SW3 OFF 來實現，此時馬達的運作狀態為？","o":["正轉","反轉","循環正反轉","停止。"],"visual":true,"img":"images/q236.webp","explanation":"SW1 與 SW4 對角導通，在馬達兩端施加一種極性，依圖的定義為正轉。"},{"s":1,"n":112,"p":26,"a":1,"q":"有刷直流馬達具有兩個電源端子，透過在這兩個端子上外加電壓以驅動馬達。兩個端子可以透過「H 橋電路」四個切換開關的電路來實現四種連接組合。圖(3)中透過將 SW1、SW4 OFF，SW2、 SW3 ON 來實現，此時馬達的運作狀態為？","o":["正轉","反轉","循環正反轉","停止。"],"visual":true,"img":"images/q237.webp","explanation":"改導通另一組對角開關後，馬達端電壓反向，轉向也反轉。"},{"s":1,"n":113,"p":26,"a":2,"q":"諧波減速機由波產生器 （Wave Generator）、彈性齒杯 （Flex Spline）、剛性齒輪 （Circular Spline） 等三個基本組件組成，具備高傳動速比、高承載能力、高傳動精度、高效率、平穩運行、結構簡單、體積小等優點。請問以下諧波減速機之應用領域何者不適合？","o":["機器人手臂和自動化設備","航空航天","入門級教育型移動機器人","醫療設備。"],"visual":false,"img":"images/q238.webp","explanation":"諧波減速機適合高精度、高減速比需求，入門教育車一般無須負擔其成本與精度規格。"},{"s":1,"n":114,"p":27,"a":3,"q":"常見的馬達機構為直流馬達搭配減速齒輪機構，請問以下關於減速機之使用敘述何者正確？","o":["可透過減速機改變輸出方向，但無法節省馬達安裝空間。","增加減速機構將會大幅增加成本，無法因採用較小功率的馬達搭配減速機，達到需要的輸出功率而節省成本。","如果出現負載過大時，馬達會先損壞","可提升馬達負載能力（提升扭力或扭矩）。"],"visual":false,"img":"images/q239.webp","explanation":"減速機把馬達高轉速換成較低輸出轉速，理想情況下轉矩按減速比放大，實際還有傳動損失。"},{"s":1,"n":115,"p":27,"a":1,"q":"行星減速機由太陽齒輪、行星齒輪、環齒輪等數個齒輪相互嚙合組成，請問以下關於行星減速機之使用敘述何者錯誤？","o":["在相同的體積下，行星減速機比起其他減速機可以承受更高的扭矩。","行星減速機組合的減速比低。","行星減速機比起其他減速機具備更高精度。","行星減速機效率損失較小，故傳輸效率高。"],"visual":false,"img":"images/q240.webp","explanation":"行星齒輪可透過不同齒數與固定構件取得多種減速比，也可多級串接，不能概括為減速比低。"},{"s":2,"n":1,"p":28,"a":3,"q":"下列何者不是影像處理的功能？","o":["追蹤物體","找特徵點","色彩空間轉換","網路偵測。"],"visual":false,"img":"images/q241.webp","explanation":"網路偵測主要屬網路通訊與診斷，影像處理主要操作像素、特徵與視覺資訊。"},{"s":2,"n":2,"p":28,"a":1,"q":"影像處理不具有下列何者特性？","o":["需大量計算資源","管理記憶體","以 GPU 執行","需使用數位訊號處理。"],"visual":false,"img":"images/q242.webp","explanation":"記憶體配置管理屬系統與程式執行機制，並非影像處理本身的特性。"},{"s":2,"n":3,"p":28,"a":1,"q":"請問在影像處理使用高通濾波器有下列何者功能？","o":["去除低頻訊號","強化影像邊緣","將影像平滑化","強化影像亮度。"],"visual":false,"img":"images/q243.webp","explanation":"影像邊緣具有快速的亮度變化，高通濾波保留高空間頻率，可強化邊緣。"},{"s":2,"n":4,"p":28,"a":0,"q":"請問一般使用灰階影像的資料格式為何？","o":["8 bits","10 bits","12 bits","16 bits。"],"visual":false,"img":"images/q244.webp","explanation":"常見灰階每像素 8 bits，能表達 2⁸＝256 種亮度。"},{"s":2,"n":5,"p":28,"a":2,"q":"請問一般使用 RGB 的資料格式為何？","o":["8 bits","16 bits","24 bits","32 bits。"],"visual":false,"img":"images/q245.webp","explanation":"常見 RGB 各通道 8 bits，三通道合計 24 bits/像素。"},{"s":2,"n":6,"p":28,"a":3,"q":"請問下列何者為線性濾波器？","o":["卡曼濾波","中值濾波","雙邊濾波","高斯濾波。"],"visual":false,"img":"images/q246.webp","explanation":"高斯濾波以固定高斯權重作加權和，符合線性疊加原理。"},{"s":2,"n":7,"p":28,"a":2,"q":"請問下列何者為非線性濾波器？","o":["高通濾波","低通濾波","雙邊濾波","高斯濾波。"],"visual":false,"img":"images/q247.webp","explanation":"雙邊濾波權重同時依像素位置與亮度差決定，權重依輸入改變，因此是非線性濾波。"},{"s":2,"n":8,"p":28,"a":0,"q":"三軸加速度計會與下列何種感測器組成慣性量測單元 (IMU)？","o":["陀螺儀","指南針","煙霧感測","瓦斯感測。"],"visual":false,"img":"images/q248.webp","explanation":"IMU 常整合三軸加速度計及三軸陀螺儀，分別提供比力與角速度資訊。"},{"s":2,"n":9,"p":28,"a":2,"q":"電子羅盤的工作原理下列何者為真？","o":["重力角速度測量角速度。","慣性原理測量角速度。","磁電效應測量地球磁場。","大氣壓力測量角速度。"],"visual":false,"img":"images/q249.webp","explanation":"電子羅盤量測地磁方向，附近金屬與電流形成的磁場會引入偏差，因此需作硬鐵、軟鐵等校正。"},{"s":2,"n":10,"p":28,"a":1,"q":"電子羅盤需要校正的原因為下列何者？","o":["電子羅盤本身設計需要校正。","受磁場環境的影響。","因為角速度會有慣性。","因周遭聲音吵雜。"],"visual":false,"img":"images/q250.webp","explanation":"電子羅盤量測地磁方向，附近金屬與電流形成的磁場會引入偏差，因此需作硬鐵、軟鐵等校正。"},{"s":2,"n":11,"p":28,"a":1,"q":"一台機器人前面有3 個箱子，箱子顏色分別為紅、黑、白，如果要辨別出前面三個箱子的顏色哪種感測器比較適合？","o":["光感測器","顏色感測器","溫度感測器","紅外線感測器。"],"visual":false,"img":"images/q251.webp","explanation":"顏色感測器分析反射光的各色分量，能區分紅、黑、白等表面。"},{"s":2,"n":12,"p":29,"a":0,"q":"關於觸碰感測器的應用，下列何者有正確？","o":["可應用於碰撞牆壁作為校正。","可利用 LED 照射物體，接收反射光線，並判斷顏色。","可應用於循跡用途。","可應用於感測物體並做出閃避動作。"],"visual":false,"img":"images/q252.webp","explanation":"與已知牆面接觸可建立位置基準，觸碰信號讓控制器確認碰牆並修正定位。"},{"s":2,"n":13,"p":29,"a":1,"q":"關於光感測器的應用，下列何者有錯誤？","o":["可應於循跡用途","可以從紅外線發射管的發射光來識別影像","可以區分黑線白線以達到精準定位","依據顏色的不同讀到的值也不同"],"visual":false,"img":"images/q253.webp","explanation":"單一發射管只負責照明，必須搭配成像與接收系統才能取得影像資訊。"},{"s":2,"n":14,"p":29,"a":3,"q":"如果一台機器人要移動到箱子前 10 公分後停下來，請問下列哪種感測器比較適合？","o":["觸碰感測器","顏色感測器","陀螺儀","超音波感測器。"],"visual":false,"img":"images/q254.webp","explanation":"超音波以往返時間估算距離，控制器可在量測值接近 10 cm 時停止。"},{"s":2,"n":15,"p":29,"a":0,"q":"如果一台機器人要移動到工件區抓取不同形狀之工件時 ， 請問下列哪種感測器比較適合？","o":["影像感測器","顏色感測器","陀螺儀","超音波感測器。"],"visual":false,"img":"images/q255.webp","explanation":"形狀辨識需要空間影像特徵，相機可取得工件輪廓及位置。"},{"s":2,"n":16,"p":29,"a":2,"q":"有關超音波感測器下列敘述何者正確？","o":["超音波感測器是一種感測周圍溫度的感測器。","超音波感測器主要目的是測量周圍聲音的分貝。","藉由送出音波傳送到被測物反射回感測器內部接收器，根據來回時間的長短來測量被測物與感測器之間的距離。","超音波感測器送出的音波若遇到被測物將直接穿過，不會有任何反射的動作。"],"visual":false,"img":"images/q256.webp","explanation":"發出聲波後接收反射波，量測來回時間 t，再以 d＝vt/2 求單程距離。"},{"s":2,"n":17,"p":29,"a":1,"q":"下列何種感應器，是仿效人體的聽覺，讓機器人擁有判斷的智慧能力？","o":["壓力感測器","聲音感測器","循線感應器","溫度感測器"],"visual":false,"img":"images/q257.webp","explanation":"麥克風等聲音感測器把聲壓變化轉成電訊號，對應聽覺。"},{"s":2,"n":18,"p":29,"a":1,"q":"下列何者感應器，是仿效人體的觸覺，讓機器人擁有判斷的智慧能力？","o":["聲音感測器","壓力感測器","超音波感測器","循線感應器"],"visual":false,"img":"images/q258.webp","explanation":"壓力感測器需藉接觸力取得受壓資訊，功能類似觸覺。"},{"s":2,"n":19,"p":29,"a":0,"q":"下列何者感應器，是仿效人體的視覺，讓機器人擁有判斷的智慧能力？","o":["光感測器","壓力感測器","觸碰感測器","超音波感應器。"],"visual":false,"img":"images/q259.webp","explanation":"光感測器把入射光轉成電訊號，功能類比視覺接收光線。"},{"s":2,"n":20,"p":29,"a":2,"q":"有關感測器的敘述，下列何者錯誤？","o":["感測器又稱傳感器。","代替人類感官檢測外界訊息。","壓力感測器是仿效人體的視覺，來感測外在的壓力。","感測器的作用是將一種能量轉換成另一種能量形式。"],"visual":false,"img":"images/q260.webp","explanation":"壓力感測器需藉接觸力取得受壓資訊，功能類似觸覺。"},{"s":2,"n":21,"p":29,"a":0,"q":"光電感測器的發送器為下列何者？","o":["發光二極體","天線","光電晶體","藍芽。"],"visual":false,"img":"images/q261.webp","explanation":"LED 將電能轉為光能，適合作為光電感測器的發光源。"},{"s":2,"n":22,"p":30,"a":2,"q":"在比賽場上，選手可以利用各種感測器來幫助比賽。試問若使用 LEGO 的觸碰感測器， 下列何種應用可以增加機器人的定位穩定性？","o":["可以用 LEGO 觸碰感測器來當做啟動按鈕。","LEGO 觸碰感測器可以用來測試是否與物體接觸，但並無法增加機器人的穩定性。","可以利用 LEGO 觸碰感測器，來達到撞牆校正的功能。","可以利用 LEGO 觸碰感測器，接觸到物體時，發出亮光增加機器人照明能力。"],"visual":false,"img":"images/q262.webp","explanation":"與已知牆面接觸可建立位置基準，觸碰信號讓控制器確認碰牆並修正定位。"},{"s":2,"n":23,"p":30,"a":1,"q":"光電感測器原理下列何者為真？","o":["將光訊號轉換成磁場訊號。","將光訊號轉換成電訊號。","將光訊號轉換成  射線訊號。","將光訊號轉換成 X 光。"],"visual":false,"img":"images/q263.webp","explanation":"光感測器把入射光轉成電訊號，功能類比視覺接收光線。"},{"s":2,"n":24,"p":30,"a":0,"q":"槽型光電感測器的工作方式下列何者為真？","o":["把一個光發射器和一個接收器面對面地裝在一個槽的兩側的是槽形光電。在無阻情況下光接收器能收到光。但當被檢測物體從槽中通過時，光被遮擋，光電開關便動作。輸出一個開關控制信號。","把發光器和收光器分離開，就可使檢測距離加大。使用時把發光器和收光器分別裝在檢測物通過路徑的兩側，檢測物通過時阻擋光路，收光器就動作輸出一個開關控制信號。","把發光器和收光器裝入同一個裝置內，在它的前方裝一塊反光板，利用反射原理完成光電控制作用。一旦光路被檢測物擋住，收光器收不到光時，光電開關就動作，輸出一個開關控制信號。","它的檢測頭裡也裝有一個發光器和一個收光器，但前方沒有反光板。當檢測物通過時擋住了光，並把光部分反射回來，收光器就收到光信號，輸出一個開關信號。"],"visual":false,"img":"images/q264.webp","explanation":"槽型感測器的發射與接收元件位於槽兩側，物體通過時遮斷光路。"},{"s":2,"n":25,"p":30,"a":1,"q":"對射型光電感測器的工作方式下列何者為真？","o":["把一個光發射器和一個接收器面對面地裝在一個槽的兩側的是槽形光電。在無阻情況下光接收器能收到光。但當被檢測物體從槽中通過時，光被遮擋，光電開關便動作。輸出一個開關控制信號。","把發光器和收光器分離開，就可使檢測距離加大。使用時把發光器和收光器分別裝在檢測物通過路徑的兩側，檢測物通過時阻擋光路，收光器就動作輸出一個開關控制信號。","把發光器和收光器裝入同一個裝置內，在它的前方裝一塊反光板，利用反射原理完成光電控制作用。一旦光路被檢測物擋住，收光器收不到光時，光電開關就動作，輸出一個開關控制信號。","它的檢測頭裡也裝有一個發光器和一個收光器，但前方沒有反光板。當檢測物通過時擋住了光，並把光部分反射回來，收光器就收到光信號，輸出一個開關信號。"],"visual":false,"img":"images/q265.webp","explanation":"對射型把發射端和接收端分開安裝，目標穿過光束時改變接收狀態。"},{"s":2,"n":26,"p":30,"a":3,"q":"顏色感測器所發射的光是什麼顏色？","o":["藍色","紅色","黃色","白色。"],"visual":false,"img":"images/q266.webp","explanation":"本題指以白光照射目標、再分析反射光的感測器。白光包含可供辨色的多個可見波段。"},{"s":2,"n":27,"p":31,"a":1,"q":"色光的三原色為哪三種顏色？","o":["藍色、白色、紅色。","藍色、綠色、紅色。","黃色、白色、藍色。","茶色、白色、紫色。"],"visual":false,"img":"images/q267.webp","explanation":"色光採加色混合，紅綠藍為三原色，三者適當混合可得到白光。"},{"s":2,"n":28,"p":31,"a":1,"q":"顏色感測器只要讀取紅色值，需在元件上安裝何者？","o":["藍色濾光器","紅色濾光器","黃色濾光器","白色濾光器。"],"visual":false,"img":"images/q268.webp","explanation":"紅色濾光器主要讓紅色波段通過，可選擇性量測紅光分量。"},{"s":2,"n":29,"p":31,"a":0,"q":"移動機器人上常用的視覺感測器為何？","o":["CCD 攝影機","聲納感應器","紅外線感應器","雷射測距儀。"],"visual":false,"img":"images/q269.webp","explanation":"CCD 是影像感測元件，可形成二維亮度或色彩資料，CMOS 相機也是常見的實際選擇。"},{"s":2,"n":30,"p":31,"a":2,"q":"在競賽中，輪型機器人需追蹤一個紅色的撞球，以下哪一種方式最有效？","o":["紅外線感測器追蹤。","超音波感測器追蹤。","CAM 配合影像處理。","壓力感測器追蹤。"],"visual":false,"img":"images/q270.webp","explanation":"相機配合顏色分割與物件定位可找出彩球位置，再將位置誤差轉成追蹤控制。"},{"s":2,"n":31,"p":31,"a":0,"q":"在機器人的比賽使用超音波量測障礙物，主要是接收？","o":["反射波","繞射波","干涉波","折射波。"],"visual":false,"img":"images/q271.webp","explanation":"發出聲波後接收反射波，量測來回時間 t，再以 d＝vt/2 求單程距離。"},{"s":2,"n":32,"p":31,"a":0,"q":"常用來量測機器人是否傾倒的感測器為？","o":["陀螺儀","里程計","電子羅盤","紅外線感測器。"],"visual":false,"img":"images/q272.webp","explanation":"陀螺儀量測角速度，可偵測身體轉動並輔助平衡控制，常與加速度計融合。"},{"s":2,"n":33,"p":31,"a":2,"q":"機器人可利用以下哪一個感測器來測量重力？","o":["陀螺儀","電子羅盤","加速度計","顏色感測器。"],"visual":false,"img":"images/q273.webp","explanation":"靜態時加速度計可用重力方向推估傾角，因此能判斷斜坡或身體朝上、朝下。"},{"s":2,"n":34,"p":31,"a":0,"q":"如果人形機器人跌倒，以下哪一種元件有助於判別機器人是正面朝下或正面朝上？","o":["加速度計","陀螺儀","電子羅盤","GPS 模組。"],"visual":false,"img":"images/q274.webp","explanation":"靜態時加速度計可用重力方向推估傾角，因此能判斷斜坡或身體朝上、朝下。"},{"s":2,"n":35,"p":31,"a":2,"q":"機器人的環境感測技術中，下列哪一種感測器屬於接觸式的？","o":["超音波感測器","雷射測距儀","壓力感測器","立體視覺。"],"visual":false,"img":"images/q275.webp","explanation":"壓力感測器需藉接觸力取得受壓資訊，功能類似觸覺。"},{"s":2,"n":36,"p":31,"a":1,"q":"以下哪一個感測技術不是家用機器人必備的？","o":["障礙物偵測","車牌辨識","人臉偵測","瓦斯與危險氣體偵測。"],"visual":false,"img":"images/q276.webp","explanation":"車牌辨識屬特定交通應用，一般家用服務機器人不以此為必要能力。"},{"s":2,"n":37,"p":31,"a":0,"q":"如果輪型機器人必須循著黑色膠帶行進，下列感測元件何者比較合適？","o":["光電感測器","超音波","熱敏電阻","電子羅盤。"],"visual":false,"img":"images/q277.webp","explanation":"黑線與白底的反射率不同，光電感測器可以藉反射強度辨識軌跡。"},{"s":2,"n":38,"p":31,"a":1,"q":"輪型機器人出賽的場地如果有很明顯的明亮度差異，可用以下何種元件分辨明暗？","o":["GPS 定位模組","光敏電阻","超音波","加速度計。"],"visual":false,"img":"images/q278.webp","explanation":"光敏電阻的阻值隨照度變化，可用分壓電路判別明暗。"},{"s":2,"n":39,"p":32,"a":0,"q":"輪型機器人要循著黑色膠帶前進，使用光電感測器量測黑色膠帶，並加裝高亮度 LED 照明，主要是為了？","o":["減少環境光的影響","降低 CdS 電阻","增加 CdS 電阻","照亮遠方的路線。"],"visual":false,"img":"images/q279.webp","explanation":"固定照明提高主動光源相對於環境光的比重，可改善黑白判別一致性。"},{"s":2,"n":40,"p":32,"a":0,"q":"要使輪型機器人能偵測平台的邊緣進而停住不跌落，可採用以下哪一種元件？","o":["反射型紅外線感測器","GPS","加速度計","陀螺儀。"],"visual":false,"img":"images/q280.webp","explanation":"朝下的反射式感測器若收不到原本地面的反射，可判斷接近落差邊緣。"},{"s":2,"n":41,"p":32,"a":1,"q":"如果機器人需要偵測障礙物以便閃避，以下哪一種元件最有幫助？","o":["溫度感測器","反射型紅外線感測器","電子羅盤","光敏電阻。"],"visual":false,"img":"images/q281.webp","explanation":"反射式紅外線發射光束並接收目標反射，可用於近距離障礙偵測，牆面量測有助迷宮轉彎判斷。"},{"s":2,"n":42,"p":32,"a":0,"q":"機器人使用紅外線感測器探測障礙物，一般會選用何種形式的紅外線？","o":["反射式","遮斷式","熱感式","壓電式。"],"visual":false,"img":"images/q282.webp","explanation":"反射式紅外線發射光束並接收目標反射，可用於近距離障礙偵測，牆面量測有助迷宮轉彎判斷。"},{"s":2,"n":43,"p":32,"a":1,"q":"輪型機器人在迷宮競走時，要探測 L 型路徑以便做轉彎，採用下列以下哪一種方式較為方便？","o":["遮斷式紅外線感測器","反射型紅外線感測器","旋轉編碼器","色彩感測器。"],"visual":false,"img":"images/q283.webp","explanation":"反射式紅外線發射光束並接收目標反射，可用於近距離障礙偵測，牆面量測有助迷宮轉彎判斷。"},{"s":2,"n":44,"p":32,"a":3,"q":"輪型機器人使用旋轉編碼器，其量測目標中，下列何者非其功能？","o":["輪子轉動的角度","移動距離","移動速度","馬達驅動電流。"],"visual":false,"img":"images/q284.webp","explanation":"編碼器的脈波反映轉動位置與速度，不能直接量出驅動電流或接觸壓力。"},{"s":2,"n":45,"p":32,"a":1,"q":"馬達使用旋轉編碼器時，以下何者為其信號讀取裝置？","o":["超音波模組","光遮斷器","整流電路","繼電器。"],"visual":false,"img":"images/q285.webp","explanation":"光遮斷器以發光元件和光電接收元件偵測圓盤孔洞，光電晶體是常用接收元件。"},{"s":2,"n":46,"p":32,"a":3,"q":"輪型機器人參加避障競走，以下哪一種元件無法用於偵測障礙物？","o":["反射式紅外線感測器","超音波感測器","雷射感測器","壓力感測器。"],"visual":false,"img":"images/q286.webp","explanation":"壓力感測器要接觸後才有壓力資訊，較不適合提前偵測障礙或牆壁距離。"},{"s":2,"n":47,"p":32,"a":3,"q":"輪型機器人行走在白色地面上有黑色電工膠帶軌跡特時，以下哪一種元件不能用來區別？","o":["紅外線感測器","色彩感測器","Cds","溫度感測器。"],"visual":false,"img":"images/q287.webp","explanation":"黑白軌跡主要以反射光差異辨識，溫度感測器沒有直接量出表面顏色的功能。"},{"s":2,"n":48,"p":32,"a":1,"q":"機器人在循跡競走的比賽場地中，以下哪一種環境條件改變影響最大？","o":["濕度","照度","溫度","噪音。"],"visual":false,"img":"images/q288.webp","explanation":"照度變化會改變光感測輸出，可能使既定黑白閾值或紅外反射判斷失準。"},{"s":2,"n":49,"p":32,"a":2,"q":"以下哪一種元件的感測方式不屬於非接觸式的？","o":["RFID","近接開關","微動開關","霍爾元件。"],"visual":false,"img":"images/q289.webp","explanation":"微動開關由物體實際碰觸推動接點，因此屬接觸式。"},{"s":2,"n":50,"p":32,"a":2,"q":"如果機器人需要偵測障礙物以便閃避，以下哪一種元件較不適合？","o":["雷射測距離","紅外線感測器","電子羅盤","超音波感測器 。"],"visual":false,"img":"images/q290.webp","explanation":"電子羅盤測磁場方向，無法直接提供前方障礙物的距離。"},{"s":2,"n":51,"p":32,"a":0,"q":"以下哪一種元件可以感測距離？","o":["反射型紅外線感測器","聲音感測器","電子羅盤","加速度計。"],"visual":false,"img":"images/q291.webp","explanation":"反射式紅外線發射光束並接收目標反射，可用於近距離障礙偵測，牆面量測有助迷宮轉彎判斷。"},{"s":2,"n":52,"p":33,"a":1,"q":"以下哪一種感測元件易受環境光線影響？","o":["超音波感測器","紅外線感測器","GPS定位模組","溫度感測器。"],"visual":false,"img":"images/q292.webp","explanation":"照度變化會改變光感測輸出，可能使既定黑白閾值或紅外反射判斷失準。"},{"s":2,"n":53,"p":33,"a":0,"q":"以下哪一種不屬於光感測元件？","o":["LED","色彩感測器","光敏電阻","紅外線感測器。"],"visual":false,"img":"images/q293.webp","explanation":"LED 主要是發光元件，題庫把它與接收光的光感測元件區分。"},{"s":2,"n":54,"p":33,"a":3,"q":"輪型機器人參加迷宮競走，以下哪一種感測元件較不會有所幫助？","o":["旋轉編碼器","超音波","紅外線感測器","壓力感測器。"],"visual":false,"img":"images/q294.webp","explanation":"壓力感測器要接觸後才有壓力資訊，較不適合提前偵測障礙或牆壁距離。"},{"s":2,"n":55,"p":33,"a":2,"q":"以下感測距離的元件中，哪一種有較好的精確度？","o":["紅外線感測器","超音波感測器","雷射測距儀","觸覺感測器。"],"visual":false,"img":"images/q295.webp","explanation":"雷射光束方向集中，可提供較細緻的距離量測，但精度仍依型號與目標表面而定。"},{"s":2,"n":56,"p":33,"a":3,"q":"輪型機器人參加避障循跡競走，採用以下哪一種元件無法偵測障礙物？","o":["紅外線感測器","超音波感測器","雷射感測器","加速度計。"],"visual":false,"img":"images/q296.webp","explanation":"加速度計量測本體運動狀態，無法直接在碰撞前量到障礙物距離。"},{"s":2,"n":57,"p":33,"a":3,"q":"旋轉編碼器可安裝在馬達轉軸上產生數位脈波訊號 ， 經過解碼器 、 計數器後轉成各種控制信號，無法作下列何種檢測？","o":["轉速","角度","定位","壓力。"],"visual":false,"img":"images/q297.webp","explanation":"編碼器的脈波反映轉動位置與速度，不能直接量出驅動電流或接觸壓力。"},{"s":2,"n":58,"p":33,"a":1,"q":"旋轉編碼器依其偵測方式可分為接觸型與非接觸型，接觸型以開關為主，如鼠標編碼器， 其優點為？","o":["壽命較長","價格便宜","較容易有開關彈跳等雜訊","可使用在較高轉速場合。"],"visual":false,"img":"images/q298.webp","explanation":"接點式編碼器結構簡單、成本低，但會有磨耗與接點彈跳。"},{"s":2,"n":59,"p":33,"a":1,"q":"旋轉編碼器依其偵測方式可分為接觸型與非接觸型，非接觸型如磁編碼器 （霍爾元件） ， 其缺點為？","o":["壽命較長。","價格較高。","不容易有開關彈跳等雜訊。","可使用在較高轉速場合。"],"visual":false,"img":"images/q299.webp","explanation":"非接觸磁編碼器需磁性元件與讀取電路，題庫以價格較高作為與簡單接點式的比較。"},{"s":2,"n":60,"p":33,"a":3,"q":"在競賽中移動機器人需追蹤一個有顏色之球，以下何種追蹤方式最有效？","o":["超音波感測器追蹤。","紅外線感測器追蹤。","接觸感測器追蹤。","CAM 配合影像感測器追蹤。"],"visual":false,"img":"images/q300.webp","explanation":"相機配合顏色分割與物件定位可找出彩球位置，再將位置誤差轉成追蹤控制。"},{"s":2,"n":61,"p":33,"a":3,"q":"以下何種感測器，量測距離為最長？","o":["超音波感測器","紅外線感測器","接觸感測器追蹤","雷射感測器。"],"visual":false,"img":"images/q301.webp","explanation":"在題目常見選項與應用範圍下，雷射可測較遠距離，實際比較需看各型號規格。"},{"s":2,"n":62,"p":33,"a":2,"q":"以下何種感測器，量測距離為最短？","o":["超音波感測器","紅外線感測器","接觸感測器追蹤","雷射感測器。"],"visual":false,"img":"images/q302.webp","explanation":"接觸感測器必須碰到物體，觸發時感測面與目標的間距接近零。"},{"s":2,"n":63,"p":34,"a":0,"q":"想要增加紅外線感測器之量測距離，可採用何種方式？","o":["採用高功率紅外線 LED。","增加紅外線 LED 之串聯電阻值。","降低電路之電源。","維持定電流驅動。"],"visual":false,"img":"images/q303.webp","explanation":"提高發射光功率可增加回波訊號，但量程也受接收靈敏度、光學設計與安全限制。"},{"s":2,"n":64,"p":34,"a":1,"q":"利用發射及接收超音波來量測距離，通常需要量測發射波與反射波之何種信號？","o":["波之頻率","時間差","波之強度","波之波長。"],"visual":false,"img":"images/q304.webp","explanation":"發出聲波後接收反射波，量測來回時間 t，再以 d＝vt/2 求單程距離。"},{"s":2,"n":65,"p":34,"a":0,"q":"如果超音波在空氣的傳遞速度為 344m/sec， 機器人發射及接收超音波反射信號共耗時0.1sec， 試問機器人與障礙物之距離約為多少公尺？","o":["17.2 m","8.6 m","4.3m","34.4m。"],"visual":false,"img":"images/q305.webp","explanation":"d＝344×0.1÷2＝17.2 m。除以 2 是因聲波走了往返路程。"},{"s":2,"n":66,"p":34,"a":1,"q":"如果超音波在空氣的傳遞速度為 344m/sec，機器人發射及接收超音波反射信號共耗時 0.07sec，試問機器人與障礙物之距離約為多少公尺？","o":["24 m","12 m","2.4m","1.2m。"],"visual":false,"img":"images/q306.webp","explanation":"d＝344×0.07÷2＝12.04 m，取最接近選項約 12 m。"},{"s":2,"n":67,"p":34,"a":3,"q":"HiTechnic 顏色感應器是利用白色 LED 照射物體表面，接收反射的光線後，判別對應的顏色，請問關於 HiTechnic 顏色感應器的顏色號碼對應出的顏色共有幾種？","o":["11","14","17","18。"],"visual":false,"img":"images/q307.webp","explanation":"18 為題庫採用的顏色號碼分類數，這是特定型號與輸出模式的設定，應與一般 RGB 數值區分。"},{"s":2,"n":68,"p":34,"a":2,"q":"關於紅外線測距感測器模組是利用 SHARP GP2Y0A21YK 反射紅外線偵測元件，可測量的距離約為哪個範圍？","o":["0~70","5~75","10~80","12~82 cm。"],"visual":false,"img":"images/q308.webp","explanation":"SHARP GP2Y0A21YK 的規定測距範圍為 10～80 cm。","source":"https://global.sharp/products/device/lineup/data/pdf/datasheet/gp2y0a21yk_e.pdf"},{"s":2,"n":69,"p":34,"a":3,"q":"關於紅外線測距感測器模組是利用 SHARP GP2Y0A21YK 反射式紅外線偵測元件，下列何者不是為主要的應用方向？","o":["可應用於近距離障礙物測距上。","可應用近距離物體偵測上。","可用於近距離非接觸開關。","可應用於遠距離測距上。"],"visual":false,"img":"images/q309.webp","explanation":"此型號有效量程 10～80 cm，超出範圍不能假設輸出仍能正確對應距離。","source":"https://global.sharp/products/device/lineup/data/pdf/datasheet/gp2y0a21yk_e.pdf"},{"s":2,"n":70,"p":34,"a":0,"q":"關於紅外線測距感測器模組是利用 SHARP GP2Y0A21YK 反射式紅外線偵測元件，下列何者不符合本產品特色？","o":["反射物體顏色會影響量測距離。","數位及類比輸出兼顧，使用簡單。","超小尺寸，易於安裝。","輸入電壓 5V。"],"visual":false,"img":"images/q310.webp","explanation":"三角測距降低了單靠反射強度測距的顏色依賴，但極低反射率等表面仍可能影響表現，不能把題庫選項解讀為完全不受材質影響。","source":"https://global.sharp/products/device/lineup/data/pdf/datasheet/gp2y0a21yk_e.pdf"},{"s":2,"n":71,"p":34,"a":1,"q":"顏色感測器使用濾色鏡分離出的三種顏色，不含以下哪一種？","o":["紅色","黃色","綠色","藍色。"],"visual":false,"img":"images/q311.webp","explanation":"常見三色分光使用 RGB，黃色可由紅綠光混合，不是其中獨立的一路。"},{"s":2,"n":72,"p":35,"a":2,"q":"以下哪一種感測元件不具有指向性？","o":["超音波感測器","紅外線感測器","GPS 定位模組","雷射感測器。"],"visual":false,"img":"images/q312.webp","explanation":"GPS 由多顆衛星信號求位置，與單一朝向的主動測距光束不同，實際接收仍受天線方向與遮蔽影響。"},{"s":2,"n":73,"p":35,"a":1,"q":"雷射測距儀於環境地圖建立及機器人定位問題上，具有許多優勢，但也有缺點，例如射出之雷射光會發生下列何種狀況？","o":["會被白色物體吸收","會穿透玻璃","會被鏡子折射","射程距離太短。"],"visual":false,"img":"images/q313.webp","explanation":"玻璃可能透射雷射或造成鏡面反射，使回波無法正確代表玻璃表面距離。"},{"s":2,"n":74,"p":35,"a":2,"q":"超音波是指音波的什麼性質超過人類耳朵可以聽到的最高範圍？","o":["震幅","週期","頻率","波長。"],"visual":false,"img":"images/q314.webp","explanation":"超音波指頻率高於人耳一般可聽上限，通常以約 20 kHz 為界。"},{"s":2,"n":75,"p":35,"a":0,"q":"在室內的比賽場地，影響超音波感測器偵測性能之主要因素是？","o":["室內溫度","室內照度","室內燈光類型","空氣透明度。"],"visual":false,"img":"images/q315.webp","explanation":"空氣聲速會隨溫度變化，固定聲速換算距離時會產生溫度相關誤差。"},{"s":2,"n":76,"p":35,"a":1,"q":"如果超音波在空氣的傳波速度為344 m/s。機器人發送並接獲超音波反射信號共耗時 0.004 秒，機器人與障礙物距離約？","o":["68.8 m","68.8 cm","137 m","137 cm。"],"visual":false,"img":"images/q316.webp","explanation":"d＝344×0.004÷2＝0.688 m＝68.8 cm。"},{"s":2,"n":77,"p":35,"a":3,"q":"在有斜坡的場地，輪型機器人可用以下哪一種元件分辨平地與斜坡？","o":["電子羅盤","GPS 模組","旋轉編碼器","加速度計。"],"visual":false,"img":"images/q317.webp","explanation":"靜態時加速度計可用重力方向推估傾角，因此能判斷斜坡或身體朝上、朝下。"},{"s":2,"n":78,"p":35,"a":2,"q":"人形機器人要保持行動時的姿態平衡，以下哪一種元件會有幫助？","o":["電子羅盤","旋轉編碼器","陀螺儀","GPS 模組。"],"visual":false,"img":"images/q318.webp","explanation":"陀螺儀量測角速度，可偵測身體轉動並輔助平衡控制，常與加速度計融合。"},{"s":2,"n":79,"p":35,"a":0,"q":"以下哪一個感測技術，不容易單獨應用於機器人環境定位及地圖建立上？","o":["陀螺儀","電子羅盤","RFID","WiFi。"],"visual":false,"img":"images/q319.webp","explanation":"陀螺儀只能提供旋轉資訊，單獨使用時缺少外界幾何與平移資訊，且積分會漂移。"},{"s":2,"n":80,"p":35,"a":3,"q":"立體視覺 （stereo vision）的原理，係利用人眼的何種特性？","o":["色辨力。","虹彩體可自動調節光線的能力。","水晶體變薄變厚來折射光線，並聚焦在視網膜上。","左右眼的視差。"],"visual":false,"img":"images/q320.webp","explanation":"同一物體在左右影像的視差與深度相關，經相機校正後可由視差求距離。"},{"s":2,"n":81,"p":35,"a":3,"q":"機器人使用紅外線感測器探測障礙物，並且能避開障礙物，一般會選用？","o":["磁感式","遮斷式","熱感式","反射式。"],"visual":false,"img":"images/q321.webp","explanation":"反射式紅外線發射光束並接收目標反射，可用於近距離障礙偵測，牆面量測有助迷宮轉彎判斷。"},{"s":2,"n":82,"p":35,"a":0,"q":"焦電型紅外線感測器是利用溫度變化，產生的什麼來進行感測？","o":["電荷","磁場","電壓","電場。"],"visual":false,"img":"images/q322.webp","explanation":"焦電材料的極化會隨溫度變化，使表面電荷改變，電路讀取此變化。"},{"s":2,"n":83,"p":35,"a":0,"q":"光遮斷器的受光元件是下列何者？","o":["光電晶體","LED","二極體","太陽能板。"],"visual":false,"img":"images/q323.webp","explanation":"光遮斷器以發光元件和光電接收元件偵測圓盤孔洞，光電晶體是常用接收元件。"},{"s":2,"n":84,"p":36,"a":1,"q":"應用於馬達轉速偵測的光遮斷圓盤有 60 個透光孔，若在 1 秒鐘測得 360 個脈波，則馬達轉速為？","o":["60 rpm","360 rpm","600 rpm","3600 rpm。"],"visual":false,"img":"images/q324.webp","explanation":"每圈 60 脈波，360 脈波/秒即 6 圈/秒，6×60＝360 rpm。"},{"s":2,"n":85,"p":36,"a":2,"q":"應用於馬達轉速偵測的光遮斷圓盤有 60 個透光孔，若測得 120 個脈波，則馬達旋轉角度為？","o":["360°","180°","720°","90°。"],"visual":false,"img":"images/q325.webp","explanation":"120÷60＝2 圈，角度＝2×360＝720°。"},{"s":2,"n":86,"p":36,"a":1,"q":"應用於馬達轉速偵測的光遮斷圓盤有 60 個透光孔，若在 1 分鐘測得 720 個脈波，則馬達轉速為？","o":["6 rpm","12 rpm","24 rpm","3 rpm。"],"visual":false,"img":"images/q326.webp","explanation":"一分鐘 720 脈波，720÷60＝12 圈/分鐘，即 12 rpm。"},{"s":2,"n":87,"p":36,"a":1,"q":"應用於馬達轉速偵測的光遮斷圓盤有1024 個透光孔，若馬達旋轉180 度時，應累計測得脈波數為何？","o":["1024 個","512 個","2048 個","256 個。"],"visual":false,"img":"images/q327.webp","explanation":"180/360×1024＝512 脈波。"},{"s":2,"n":88,"p":36,"a":2,"q":"應用於馬達轉速偵測的光遮斷圓盤有1024 個透光孔，若累計測得256 個脈波，則此時段內馬達轉動的角度為？","o":["30 度","60 度","90 度","256 度。"],"visual":false,"img":"images/q328.webp","explanation":"256/1024×360＝90°。"},{"s":2,"n":89,"p":36,"a":2,"q":"應用於馬達轉速偵測的光遮斷圓盤有 1024 個透光孔，若累計測得 2048 個脈波，則此時段內馬達轉動的角度為？","o":["90 度","1024 度","720 度","2048 度。"],"visual":false,"img":"images/q329.webp","explanation":"2048/1024×360＝720°。"},{"s":2,"n":90,"p":36,"a":1,"q":"霍爾感測器主要是用來偵測？","o":["電壓","磁場","溫度","電場。"],"visual":false,"img":"images/q330.webp","explanation":"霍爾效應以磁場下的橫向電壓變化取得磁場資訊。"},{"s":2,"n":91,"p":36,"a":1,"q":"機器人要抓住罐頭並舉起來，以下哪一種元件有助於抓力之控制？","o":["加速度計","壓力感測器","震動感測器","觸碰感測器。"],"visual":false,"img":"images/q331.webp","explanation":"量測接觸壓力可回授夾持力，避免抓力不足滑落或抓力過大壓壞工件。"},{"s":2,"n":92,"p":36,"a":3,"q":"下列何種感測器可測量角速度？","o":["電位計","轉速計","旋轉編碼器","以上皆是。"],"visual":false,"img":"images/q332.webp","explanation":"題目所列角速度感測元件均利用陀螺量測原理或提供對應輸出，因此選全部。"},{"s":2,"n":93,"p":36,"a":3,"q":"LiDAR 是利用什麼來量測距離？","o":["電波反射","超音波反射","光影","雷射光反射。"],"visual":false,"img":"images/q333.webp","explanation":"LiDAR 利用雷射回波的時間、相位等資訊換算距離。"},{"s":2,"n":94,"p":36,"a":1,"q":"要提高 LiDAR 的性能，實現“更長距離”和“更高空間解析度”的感測，作為感測光源的雷射二極體不會具有下列哪一種需求？","o":["更高輸出功率","更高效率","更高的頻率","更小的光束。"],"visual":false,"img":"images/q334.webp","explanation":"題庫選更高效率，但效率仍影響散熱與功耗，並非完全無關。較直接決定距離與解析度的是峰值光功率、脈衝寬度及光束品質等條件。"},{"s":2,"n":95,"p":36,"a":1,"q":"一般影像處理常會把 RGB 影像轉換為 HSV 系統。請問其中的 H 代表什麼意義？","o":["飽和度","色相","亮度","彩度。"],"visual":false,"img":"images/q335.webp","explanation":"H 是 Hue，以色相表示紅、綠、藍等顏色類別。"},{"s":2,"n":96,"p":37,"a":0,"q":"一般影像處理常會把 RGB 影像轉換為 HSV 系統。請問其中的 S 代表什麼意義？","o":["飽和度","色相","亮度","彩度。"],"visual":false,"img":"images/q336.webp","explanation":"S 是 Saturation，描述顏色的飽和程度，越低越接近灰色。"},{"s":2,"n":97,"p":37,"a":2,"q":"一般影像處理常會把 RGB 影像轉換為 HSV 系統。請問其中的 V 代表什麼意義？","o":["飽和度","色相","亮度","彩度。"],"visual":false,"img":"images/q337.webp","explanation":"V 是 Value，表示 HSV 模型的明亮程度。"},{"s":2,"n":98,"p":37,"a":1,"q":"IMU 是下列何者的縮寫？","o":["中央處理單元","慣性測量單元","陀螺儀","超音波感測器。"],"visual":false,"img":"images/q338.webp","explanation":"IMU 常整合三軸加速度計及三軸陀螺儀，分別提供比力與角速度資訊。"},{"s":2,"n":99,"p":37,"a":2,"q":"Gyrosensor (或 Gyroscope) 是下列何者的縮寫？","o":["中央處理單元","慣性測量單元","陀螺儀","超音波感測器。"],"visual":false,"img":"images/q339.webp","explanation":"Gyroscope 是陀螺儀，可量測角速度。"},{"s":2,"n":100,"p":37,"a":1,"q":"一般我們使用的 Web CAM 得到的是幾維的影像資訊？","o":["一維","二維","三維","四維。"],"visual":false,"img":"images/q340.webp","explanation":"一般單目相機給出水平與垂直像素座標，單張影像不直接提供各點深度。"},{"s":2,"n":101,"p":37,"a":2,"q":"一般深度相機得到的是幾維的影像資訊？","o":["一維","二維","三維","四維。"],"visual":false,"img":"images/q341.webp","explanation":"深度相機能為像素提供距離，搭配相機內部參數可還原三維座標。"},{"s":2,"n":102,"p":37,"a":3,"q":"彩色深度相機(RGBD Camera)與光達感測器(LiDAR Sensor)的相異處為何？","o":["彩色資訊","感測距離","感測資料量","以上皆是。"],"visual":false,"img":"images/q342.webp","explanation":"RGBD 常輸出色彩與深度影像，LiDAR 常提供角度與距離或點雲，成像原理、視野與解析度也依設備而異。"},{"s":2,"n":103,"p":37,"a":3,"q":"雷達感測器(RADAR Sensor)與光達感測器(LiDAR Sensor)的相異處為何？？","o":["光源頻率","感測距離","感測解析度","以上皆是。"],"visual":false,"img":"images/q343.webp","explanation":"RADAR 使用無線電波，LiDAR 使用光波，波長差異會影響解析度、表面互動及天候表現。"},{"s":2,"n":104,"p":37,"a":0,"q":"單一個超音波感測器比較適合用於偵測下列哪種資料？","o":["是否有障礙物","障礙物材質","障礙物方位","障礙物的體積。"],"visual":false,"img":"images/q344.webp","explanation":"單顆超音波在一個波束範圍量回波，適合判斷是否有障礙與大致距離，難以單獨辨別形狀。"},{"s":2,"n":105,"p":37,"a":2,"q":"機器人組成架構可分為機械模組、傳感模組、控制模組等三大模組和能源系統，請問下列何者屬於傳感模組？","o":["感知系統","控制系統","雷射測距儀(LiDAR)","機械結構系統。"],"visual":false,"img":"images/q345.webp","explanation":"傳感模組接收環境資訊，LiDAR 屬此模組，功能可類比人的感官。"},{"s":2,"n":106,"p":37,"a":1,"q":"機器人組成架構可分為機械模組、傳感模組、控制模組等三大模組和能源系統，請問傳感模組可類比於下列何者人體構造？","o":["骨骼結構","眼耳鼻舌等感官","大腦","神經系統。"],"visual":false,"img":"images/q346.webp","explanation":"傳感模組接收環境資訊，LiDAR 屬此模組，功能可類比人的感官。"},{"s":2,"n":107,"p":37,"a":0,"q":"以下何者不是光達感測器之優點？","o":["對玻璃表面之效果佳","物體距離量測之誤差小","可得到環境掃描資料","不受環境光線影響。"],"visual":false,"img":"images/q347.webp","explanation":"玻璃可能透射雷射或造成鏡面反射，使回波無法正確代表玻璃表面距離。"},{"s":2,"n":108,"p":38,"a":2,"q":"光達感測器的輸出資料形式為？","o":["單一點位距離","單一點位相對應視線的方向","點雲(point cloud)","單一點位範圍。"],"visual":false,"img":"images/q348.webp","explanation":"點雲是一組空間點座標，可附帶強度等欄位，用於重建環境幾何。"},{"s":2,"n":109,"p":38,"a":3,"q":"以下對於 2D 光達感測器的應用之敘述，何者錯誤？","o":["2D 光達感測器的偵測範圍是一個平面","2D 光達感測器無法偵測只出現在雷射掃描高度以上的移動物體","2D 光達感測器利用光速和物體反射雷射的時間來計算距離","2D 光達感測器可以偵測高度小於雷射掃描高度的固定物體。"],"visual":false,"img":"images/q349.webp","explanation":"2D 光達只掃描一個平面，物體若完全低於掃描平面，光束就不會碰到它。"},{"s":2,"n":110,"p":38,"a":3,"q":"移動機器人在定位與建圖時經常採用的里程計(odometry)技術，主要是依靠哪一種感測器的資訊？","o":["超音波","光達感測器","慣性感測器","車輪編碼器。"],"visual":false,"img":"images/q350.webp","explanation":"車輪編碼器量出轉動量，再由輪徑與底盤模型估計位移，累積誤差會受打滑影響。"},{"s":2,"n":111,"p":38,"a":1,"q":"機器人常用的感測器有機械觸碰式感測器、超音波感測器、顏色感測器、光感測器、紅外線距離感測器。使用光感測器進行循跡行走時的應用描述，下列何者正確？","o":["使用一顆光感測器進行循跡時可以分辨交叉軌跡","使用一顆光感測器進行循跡時，以沿著軌跡邊緣行進為目標","使用一顆光感測器進行循跡時 ， 機器人的行進速度可以任意調整 ， 不會發生脫離軌道的情況","使用光感測器進行循跡時，可以使用閃光燈拍照，不會對機器人的循跡功能造成影響"],"visual":false,"img":"images/q351.webp","explanation":"單感測器沿黑白邊界控制反射強度，比追求一直位在黑線中央更能提供左右修正依據。"},{"s":2,"n":112,"p":38,"a":2,"q":"機器人機構可以利用 2 個超音波感應器組裝於前方左右兩側，利用此 2 個超音波感應器進行定位。關於利用 2 個超音波感應器定位的敘述何者錯誤？","o":["利用左右超音波感應器的距離差，可知道機器人對於前方平整大面積障礙的相對位置和姿態","可利用左右超音波感應器的距離差，採用 PID 控制驅動輪進行垂直於前方平整大面積障礙的定位","可利用左右超音波感應器的距離差，知道機器人的絕對行進方位角","可利用左右超音波感應器的距離差 ， 採用比例控制法控制驅動輪 ， 進行垂直於前方平整大面積障礙的定位。"],"visual":false,"img":"images/q352.webp","explanation":"左右距離差至多在已知牆面幾何等條件下推估相對角度，不能直接給出全球座標的絕對方位。"},{"s":2,"n":113,"p":38,"a":0,"q":"針對差速驅動輪型車行進時使用單光源感應器偵測黑線，欲越過一條黑線，在第二條黑線處停止的應用，下列敘述何者錯誤？","o":["行進時遇到第一條黑線後，持續前進直到光感應器偵測到下一個反射光強度小於 50% 後停止。","行進時遇到第一條黑線後 ， 持續前進直到越過第一條黑線後 ， 再以光感應器偵測到第二條黑線後停止。","光感應器使用主動模式打光，以減少環境光變化的影響。","光感應器離偵測地面距離不宜過高，以避免環境光變化的影響。"],"visual":false,"img":"images/q353.webp","explanation":"越過第一條黑線後，必須先確認離開黑線回到白底，再等待第二次進入黑線，否則仍在第一條黑線上就會停止。"},{"s":2,"n":114,"p":38,"a":1,"q":"下列何者不是輪型移動機器人使用的外部感測器？","o":["雷射掃描器","編碼器","超音波感測器","CCD 或 CMOS 攝影機。"],"visual":false,"img":"images/q354.webp","explanation":"編碼器量測車體內部輪軸運動，通常分類為內部感測器。"},{"s":2,"n":115,"p":39,"a":3,"q":"下列感測器所使用的感測信號，何者採用直線傳播的介質？","o":["超音波感測器","觸碰感測器","霍爾磁力感測器","單點雷測距離感測器。"],"visual":false,"img":"images/q355.webp","explanation":"單點雷射測距以方向集中的光束量距，題庫採光近似直線傳播的特性。"},{"s":3,"n":1,"p":40,"a":2,"q":"用一個 1.3 Kg-cm 的 RC Servo （伺服馬達）要將重 200 公克的貨物舉起。試問手臂應製作在幾公分內才能將物體舉起？","o":["7","7.5","6.5","8 cm。"],"visual":false,"img":"images/q356.webp","explanation":"以 kgf·cm 為單位，負載轉矩＝0.2×力臂。1.3÷0.2＝6.5 cm，這是理想極限，實作需留裕度。"},{"s":3,"n":2,"p":40,"a":1,"q":"下圖中的夾爪機構，是使用何種馬達？","o":["DC Motor （DC 直流馬達）。","RC Servo （伺服馬達）。","步進馬達。","DC 直流無刷伺服馬達。"],"visual":true,"img":"images/q357.webp","explanation":"RC 伺服機可直接控制夾爪的有限角度，內部回授讓其保持指定位置。"},{"s":3,"n":3,"p":40,"a":2,"q":"直流馬達控制轉速常用下列何種方式執行？","o":["變頻器","捕捉脈衝","脈波寬度調變","相位調變。"],"visual":false,"img":"images/q358.webp","explanation":"PWM 改變供電開關的導通占空比，以調節馬達平均電壓與速度。"},{"s":3,"n":4,"p":40,"a":3,"q":"KNRm 的直流馬達規格，齒輪比為 64:1，編碼器的光遮斷圓盤有 16 個透光孔，輸出軸旋轉一圈，會累計測得多少脈波？","o":["256","512","768","1024。"],"visual":false,"img":"images/q359.webp","explanation":"每輸出一圈，內部轉 64 圈，每圈 16 脈波，合計 64×16＝1024 脈波。"},{"s":3,"n":5,"p":40,"a":2,"q":"KNRm 的直流馬達規格，齒輪比為 27：1，編碼器的光遮斷圓盤有 32 個透光孔，輸出軸旋轉一圈，會累計測得多少脈波？","o":["256","512","864","1024。"],"visual":false,"img":"images/q360.webp","explanation":"27×32＝864 脈波/輸出圈。"},{"s":3,"n":6,"p":40,"a":0,"q":"KNRm 的直流馬達規格，齒輪比為 27：1，編碼器的光遮斷圓盤有 32 個透光孔，輸出軸旋轉 90 度，會累計測得多少脈波？","o":["216","432","864","1024。"],"visual":false,"img":"images/q361.webp","explanation":"27×32×90/360＝216 脈波。"},{"s":3,"n":7,"p":40,"a":2,"q":
