01,"p":57,"a":1,"q":"若一差速驅動輪型機器人輪胎直徑為 60mm，請問輪胎轉動一圈的距離為何？","o":["( 2 × 60 × 圓周率 ) mm","( 60 × 圓周率 ) mm","( √60 × 圓周率 ) mm","( 30 × 圓周率 ) mm。"],"visual":false,"img":"images/q456.webp","explanation":"無滑動一圈路程為周長 πd＝60π mm。"},{"s":3,"n":102,"p":57,"a":0,"q":"若給定一差速驅動輪型機器人的直線運動速度為 50mm/s、旋轉角速度為 20deg/s，請問輪型機器人的運動行為為何？","o":["離開原地並往左前方轉彎前進","直線後退","離開原地並往右前方轉彎前進","離開原地並往右後方轉彎後退。"],"visual":false,"img":"images/q457.webp","explanation":"線速度為正且角速度為正，依常見逆時針為正約定，車體會向左前方走弧線。"},{"s":3,"n":103,"p":57,"a":1,"q":"若給定一差速驅動輪型機器人的直線運動速度為 –50 mm/s、旋轉角速度為 0 deg/s，請問輪型機器人的運動行為為何？","o":["離開原地並往左後方轉彎後退","直線後退","離開原地並往右前方轉彎前進","離開原地並往右後方轉彎後退。"],"visual":false,"img":"images/q458.webp","explanation":"負線速度表示後退，角速度為零表示方向不旋轉，因此直線後退。"},{"s":3,"n":104,"p":57,"a":2,"q":"馬達切換式功率放大器中的功率電晶體是操作於？","o":["截止區","飽和區","以上皆是","以上皆非。"],"visual":false,"img":"images/q459.webp","explanation":"切換式功率級主要在截止與飽和或低導通電阻狀態間切換，避免長時間在高耗散的線性區。"},{"s":3,"n":105,"p":58,"a":3,"q":"針對下圖之三輪全向底盤運動模型，若 Vx > 0，Vy = 0， = 0，對於底盤運動的敘述何者錯誤？","o":["朝 Vx 方向直線運動","輪正轉","輪倒轉","輪正轉。"],"visual":true,"img":"images/q460.webp","explanation":"沿 Vx 向上的純平移投影，輪①正轉、輪②倒轉，輪③的驅動方向與 Vx 垂直所以速度為 0。因此輪③正轉的 D 錯誤。"},{"s":3,"n":106,"p":58,"a":3,"q":"針對下圖之三輪全向底盤運動模型，若 Vx = 0，Vy > 0， = 0，對於底盤運動的敘述何者錯誤？","o":["朝 Vy 方向直線運動","輪倒轉","輪倒轉","輪以 2 倍於輪之速度倒轉。"],"visual":true,"img":"images/q461.webp","explanation":"沿 Vy 向左純平移，輪①和輪②倒轉，輪③正轉，速度大小為輪①的 2 倍。因此 D 把輪③寫成倒轉有誤。"},{"s":3,"n":107,"p":58,"a":0,"q":"針對下圖之三輪全向底盤運動模型，若 Vx = 0，Vy = 0， \u003c 0，對於底盤運動的敘述何者錯誤？","o":["繞車體中心逆時針旋轉","輪正轉","輪正轉","輪正轉。"],"visual":true,"img":"images/q462.webp","explanation":"常見平面模型以逆時針為正，ω\u003c0 表示順時針，因此逆時針敘述錯誤。"},{"s":3,"n":108,"p":59,"a":1,"q":"請問若要控制輪型移動機器人行走以下正三角形軌跡 ， 機器人在正三角形頂點時需轉彎多少度？","o":["60 度","120 度","30 度","150 度。"],"visual":true,"img":"images/q463.webp","explanation":"沿正三角形邊行走時，轉的是外角，360÷3＝120°，內角為 60°。"},{"s":3,"n":109,"p":59,"a":0,"q":"PID 控制是一個簡單有效的控制方法，在工業上和馬達控制的應用是一個很重要的控制技術。請問 PID 控制中的 P 控制主要目的為何？","o":["提高控制系統的響應速度，透過調整比例增益 Kp 以達到目的","減少控制系統的穩態誤差，加速系統趨近參考目標值的過程，理想結果是將穩態誤差驅動至 0","預測控制系統的誤差，對系統的改變作出反應，可以減少安定時間及提昇系統穩定性","將目標輸出回授，與參考目標值相減得到誤差值，再針對誤差值進行積分運算得到控制輸出，讓系統輸出保持在目標值。"],"visual":false,"img":"images/q464.webp","explanation":"P 項輸出＝Kp×當前誤差，調整比例增益可提高反應速度，太大也可能增加振盪。"},{"s":3,"n":110,"p":59,"a":1,"q":"PID 控制是一個簡單有效的控制方法，在工業上和馬達控制的應用是一個很重要的控制技術。請問 PID 控制中的 I 控制主要目的為何？","o":["提高控制系統的響應速度，透過調整比例增益 Kp 以達到目的","減少控制系統的穩態誤差，加速系統趨近參考目標值的過程，理想結果是將穩態誤差驅動至 0","預測控制系統的誤差，對系統的改變作出反應，可以減少安定時間及提昇系統穩定性","將目標輸出回授，與參考目標值相減得到誤差值，再針對誤差值進行積分運算得到控制輸出，讓系統輸出保持在目標值。"],"visual":false,"img":"images/q465.webp","explanation":"I 項累積誤差，持續修正固定偏差，理想穩定條件下能消除穩態誤差。"},{"s":3,"n":111,"p":59,"a":2,"q":"PID 控制是一個簡單有效的控制方法，在工業上和馬達控制的應用是一個很重要的控制技術。請問 PID 控制中的 D 控制主要目的為何？","o":["提高控制系統的響應速度，透過調整比例增益 Kp 以達到目的","減少控制系統的穩態誤差，加速系統趨近參考目標值的過程，理想結果是將穩態誤差驅動至 0","預測控制系統的誤差，對系統的改變作出反應，可以減少安定時間及提昇系統穩定性","將目標輸出回授，與參考目標值相減得到誤差值，再針對誤差值進行積分運算得到控制輸出，讓系統輸出保持在目標值。"],"visual":false,"img":"images/q466.webp","explanation":"D 項依誤差變化率提供阻尼，幫助抑制超越量和振盪，但對雜訊敏感。"},{"s":4,"n":1,"p":60,"a":1,"q":"在 Vision Assistant 中，請問使用 Color Threshold 閥值最大能設定為多少？","o":["128","255","511","1023。"],"visual":false,"img":"images/q467.webp","explanation":"8 位元色彩通道的整數範圍為 0～2⁸−1＝255。"},{"s":4,"n":2,"p":60,"a":3,"q":"在 Vision acquisition 中，請問使用羅技 C310 最大的 fps 能設定為多少？","o":["12","18","25","30。"],"visual":false,"img":"images/q468.webp","explanation":"本題採 C310 的 30 fps 取像設定，每秒最多 30 張，實際支援值需配合解析度與驅動模式。"},{"s":4,"n":3,"p":60,"a":2,"q":"在 Vision acquisition 中，請問使用羅技 C310 最大的影像的解析度能設定為多少？","o":["800x600","1024x768","1280x960","1600x960。"],"visual":false,"img":"images/q469.webp","explanation":"1280×960 是題庫指定的 Vision Acquisition 模式，並非所有驅動介面下唯一的相機最大規格。"},{"s":4,"n":4,"p":60,"a":3,"q":"在 Vision acquisition 中，請問 NI 預設的影像處理流程要經過幾個程序？","o":["2","3","4","5。"],"visual":false,"img":"images/q470.webp","explanation":"五個程序是題庫教材採用的 NI 影像處理流程分段，屬特定工具與教學版本的設定。"},{"s":4,"n":5,"p":60,"a":1,"q":"在 LabVIEW 中，下圖的的連接線的格式下列何者為正確？","o":["雙精準浮點數資料線","二維雙精準浮點數資料線","一維布林資料線","一維整數資料線。"],"visual":true,"img":"images/q471.webp","explanation":"LabVIEW 線條顏色表示基本型態，粗細或排列表示純量及陣列維度。浮點通常橘色、布林綠色，二維陣列需依圖中的多重線樣式辨識。"},{"s":4,"n":6,"p":60,"a":2,"q":"在 LabVIEW 中，下圖的的連接線的格式下列何者為正確？","o":["雙精準浮點數資料線","二維單精準浮點數資料線","一維布林資料線","一維整數資料線。"],"visual":true,"img":"images/q472.webp","explanation":"LabVIEW 線條顏色表示基本型態，粗細或排列表示純量及陣列維度。浮點通常橘色、布林綠色，二維陣列需依圖中的多重線樣式辨識。"},{"s":4,"n":7,"p":60,"a":1,"q":"在 LabVIEW 中，下圖的的連接線的格式下列何者為正確？","o":["一維字串資料線","二維資料線","二維整數資料線","二維單精準浮點數資料線。"],"visual":true,"img":"images/q473.webp","explanation":"LabVIEW 線條顏色表示基本型態，粗細或排列表示純量及陣列維度。浮點通常橘色、布林綠色，二維陣列需依圖中的多重線樣式辨識。"},{"s":4,"n":8,"p":60,"a":3,"q":"在 LabVIEW 中，有號數最大能支援多少位元？","o":["8 Bits","16 Bits","32 Bits","64 Bits。"],"visual":false,"img":"images/q474.webp","explanation":"常見有號整數型別包括 I8、I16、I32 與 I64，I64 為 64 位元。"},{"s":4,"n":9,"p":60,"a":0,"q":"在 LabVIEW 中，下圖的資料格式為下列何者？","o":["無符號 64 位元整數。","有符號 64 位元整數。","字串。","無符號 64 位元浮點數。"],"visual":true,"img":"images/q475.webp","explanation":"U64 的 U 表 unsigned，64 表儲存位元數，可表示非負的 64 位元整數。"},{"s":4,"n":10,"p":61,"a":2,"q":"在 LabVIEW 中，下圖的資料格式為下列何者？","o":["無符號 64 位元整數","有符號 64 位元整數","字串","無符號 64 位元浮點數。"],"visual":true,"img":"images/q476.webp","explanation":"LabVIEW 字串常用粉紅色端子或連線，內容為字元序列。"},{"s":4,"n":11,"p":61,"a":3,"q":"在 LabVIEW 中，下圖的資料格式為下列何者？","o":["無符號 16 位元整數","有符號 32 位元整數","字串","布林。"],"visual":true,"img":"images/q477.webp","explanation":"布林僅表達真或假，LabVIEW 常以綠色端子或連線表示。"},{"s":4,"n":12,"p":61,"a":0,"q":"在 LabVIEW 中，下圖的結構通道輸出為下列何者？","o":["雙精準浮點數","一維雙精準浮點數","二維雙精準浮點數","字串。"],"visual":true,"img":"images/q478.webp","explanation":"迴圈輸出通道若未啟用自動索引，輸出最後一次純量值。啟用索引時會收集各次值，成為一維陣列。"},{"s":4,"n":13,"p":61,"a":1,"q":"在 LabVIEW 中，下圖的結構通道輸出為下列何者？","o":["雙精準浮點數","一維雙精準浮點數","二維雙精準浮點數","字串。"],"visual":true,"img":"images/q479.webp","explanation":"迴圈輸出通道若未啟用自動索引，輸出最後一次純量值。啟用索引時會收集各次值，成為一維陣列。"},{"s":4,"n":14,"p":61,"a":3,"q":"在 LabVIEW 中，While 迴圈執行到哪一步時會將資料從結構通道輸出？","o":["還沒執行便會將資料輸出。","只有第一次執行會輸出。","迴圈每次執行都會輸出。","迴圈結束時會輸出。"],"visual":false,"img":"images/q480.webp","explanation":"迴圈內可多次更新資料，但結構外的程式需等待 While 結束後才取得一般輸出通道資料。"},{"s":4,"n":15,"p":62,"a":0,"q":"下圖為 LabVIEW 的亂數，請問亂數產生的範圍為下列何者？","o":["0~1","0~10","0~100","0~1000。"],"visual":true,"img":"images/q481.webp","explanation":"LabVIEW 的標準亂數函數輸出大於等於 0、小於 1 的均勻分布值。"},{"s":4,"n":16,"p":62,"a":1,"q":"下圖為 LabVIEW 的亂數，請問若要產生 0~100 亂數值，需將亂數函數乘上幾倍？","o":["10","100","1000","5000。"],"visual":true,"img":"images/q482.webp","explanation":"把 [0,1) 的亂數乘 100 得到 [0,100)，若需包含端點的整數還須設計取整方式。"},{"s":4,"n":17,"p":62,"a":1,"q":"下圖為 LabVIEW 的 wait，請問 wait 執行的單位為下列何者？","o":["sec","ms","us","ns。"],"visual":true,"img":"images/q483.webp","explanation":"Wait 函數的輸入為毫秒，1000 ms＝1 s。"},{"s":4,"n":18,"p":62,"a":2,"q":"下圖為 Wait Until next ms Multiple ，一個 While 迴圈裡的程式需要 10 ms 來執行，並同時置放了 Wait Until next ms Multiple 並且設定了 100 ms。此 While 迴圈確認是於每隔多少倍數的時間點開始執行？","o":["10ms","50ms","100ms","200ms。"],"visual":true,"img":"images/q484.webp","explanation":"Wait Until Next ms Multiple 對齊系統毫秒計數的指定倍數，設定 100 就在 100 ms 的倍數點對齊。"},{"s":4,"n":19,"p":62,"a":0,"q":"LabVIEW 的 Global Variable 它所能執行的範圍為下列何者？","o":["在同一台電腦的 VI 都可以互傳。","限在一個 VI 互傳。","可以在網際網路互傳。","可以與其他裝置互傳。"],"visual":false,"img":"images/q485.webp","explanation":"全域變數可在同一 LabVIEW 應用程式執行個體內的多個 VI 間分享。題庫簡化為同電腦，跨執行個體仍需另外通訊。"},{"s":4,"n":20,"p":62,"a":1,"q":"LabVIEW 的 Local Variable 它所能執行的範圍為下列何者？","o":["在同一台電腦的 VI 都可以互傳。","限在一個 VI 互傳。","可以在網際網路互傳。","可以與硬體裝置互傳。"],"visual":false,"img":"images/q486.webp","explanation":"區域變數讀寫同一 VI 前面板控制項或指示器，作用範圍限於該 VI。"},{"s":4,"n":21,"p":62,"a":2,"q":"LabVIEW 的 Share Variable 它所能執行的範圍為下列何者？","o":["在同一台電腦的 VI 都可以互傳。","限在一個 VI 互傳。","可以在網際網路互傳。","可以與硬體裝置互傳。"],"visual":false,"img":"images/q487.webp","explanation":"網路共享變數可透過網路發布與讀取，用於不同電腦或執行目標間傳遞資料。"},{"s":4,"n":22,"p":63,"a":3,"q":"LabVIEW 的一維陣列有 10 個元素，每個元素的數值型態為 32 位元無符號整數，請算這個陣列所占用的 Byte 數？","o":["320","32","40","44。"],"visual":false,"img":"images/q488.webp","explanation":"10 個 U32 資料占 10×4＝40 bytes，題庫再計入一維陣列的 4-byte 維度長度欄位，合計 44。","source":"https://www.ni.com/docs/en-US/bundle/labview/page/how-labview-stores-data-in-memory.html"},{"s":4,"n":23,"p":63,"a":2,"q":"對於一般程式而言，一維陣列有 10 個元素，每個元素的數值型態為 32 位元無符號整數， 請算這個陣列所占用的 Byte 數？","o":["320","32","40","400。"],"visual":false,"img":"images/q489.webp","explanation":"僅計資料本體，10×32/8＝40 bytes。"},{"s":4,"n":24,"p":63,"a":3,"q":"對於一般程式而言，二維陣列 ROW 有 12 個元素、COL 有 8 個元素，每個元素的數值型態為 64 位元有符號整數，請算這個陣列所占用的 Byte 數？","o":["200","330","680","768。"],"visual":false,"img":"images/q490.webp","explanation":"元素數 12×8＝96，每個 64/8＝8 bytes，總計 96×8＝768 bytes。"},{"s":4,"n":25,"p":63,"a":1,"q":"對於一般程式而言，二維陣列 ROW 有 12 個元素、COL 有 16 個元素，每個元素的數值型態為布林，請計算這個陣列所占用的 Byte 數？","o":["12","24","35","48。"],"visual":false,"img":"images/q491.webp","explanation":"題庫以布林位元打包計算，12×16 bits÷8＝24 bytes。一般語言的 bool 陣列可能每元素占 1 byte，因此實際儲存須看語言與容器。"},{"s":4,"n":26,"p":63,"a":3,"q":"依下圖所示其輸出結果為何？","o":["3","5","3","7。"],"visual":true,"img":"images/q492.webp","explanation":"圖中加法節點的兩個純量輸入為 5 和 2，輸出 5＋2＝7。"},{"s":4,"n":27,"p":63,"a":2,"q":"依下圖所示其輸出結果為何？","o":["3、0、5","7、8、1、5","7、4、9","1。"],"visual":true,"img":"images/q493.webp","explanation":"陣列與純量相加時，純量對每個元素加一次，(5,2,7)＋2＝(7,4,9)。"},{"s":4,"n":28,"p":63,"a":2,"q":"依下圖所示其輸出結果為何？","o":["5、2、3","1、8、9","7、11、13","4、14、8。"],"visual":true,"img":"images/q494.webp","explanation":"陣列相加逐元素運算，(5,2,7)＋(2,9,6)＝(7,11,13)。輸入框左端的 0 是索引顯示，灰色位置不應當成有效元素。"},{"s":4,"n":29,"p":64,"a":0,"q":"在 LabVIEW 按鈕的機械動作特性中，下列哪個圖示表示按下立即切換？","o":[],"visual":true,"img":"images/q495.webp","explanation":"按下立即切換會在滑鼠按下時改變狀態，放開後保持新值，讀取不會使其自動復原。"},{"s":4,"n":30,"p":64,"a":1,"q":"在 LabVIEW 按鈕的機械動作特性中，下列哪個圖示表示按下釋放才切換？","o":[],"visual":true,"img":"images/q496.webp","explanation":"釋放才切換是在滑鼠放開時改變並保持狀態，與按下當刻切換不同。"},{"s":4,"n":31,"p":64,"a":2,"q":"在 LabVIEW 按鈕的機械動作特性中，下列哪個圖示表示按下切換直至釋放為止？","o":[],"visual":true,"img":"images/q497.webp","explanation":"按下時改變狀態，放開後回復，按住期間維持切換值。"},{"s":4,"n":32,"p":64,"a":3,"q":"在 LabVIEW 按鈕的機械動作特性中，下列哪個圖示表示按下立即拴鎖？","o":[],"visual":true,"img":"images/q498.webp","explanation":"按下立即拴鎖在按下時改變值，等程式讀取後才自動回復預設狀態。"},{"s":4,"n":33,"p":64,"a":1,"q":"在 LabVIEW 按鈕的機械動作特性中，下列哪個圖示表示按下釋放後才拴鎖？","o":[],"visual":true,"img":"images/q499.webp","explanation":"釋放後拴鎖在放開滑鼠時改變值，直到程式讀取後回復。"},{"s":4,"n":34,"p":64,"a":0,"q":"在 LabVIEW 按鈕的機械動作特性中，下列哪個圖示表示按下拴鎖直至釋放為止？","o":[],"visual":true,"img":"images/q500.webp","explanation":"拴鎖直至釋放同時考量讀取與滑鼠釋放，符合兩者條件後才回復預設值。"},{"s":4,"n":35,"p":64,"a":3,"q":"依下圖所示，Input 為 5，其輸出結果為何？","o":["5","19","25","31。"],"visual":true,"img":"images/q501.webp","explanation":"圖中公式為 Y＝X²＋X＋1。代入 X＝5，得 25＋5＋1＝31。"},{"s":4,"n":36,"p":65,"a":2,"q":"依下圖所示，Input 為 8，其輸出結果為何？","o":["158","238","584","985。"],"visual":true,"img":"images/q502.webp","explanation":"pow(x,3) 表示 x³，pow(x,2) 表示 x²。代入 x＝8，得到 512＋64＋8＝584。"},{"s":4,"n":37,"p":65,"a":2,"q":"在 LabVIEW 中使用 case 來做決策，不能使用下列何者資料型態？","o":["列舉","字串","波形圖","錯誤。"],"visual":false,"img":"images/q503.webp","explanation":"Case 選擇端子可接適用的離散選擇型態，波形資料不是直接的分支選擇值。"},{"s":4,"n":38,"p":65,"a":0,"q":"SUBVI 在 C 語言中所扮演的角色為何？","o":["函數","樣板","結構","指標。"],"visual":false,"img":"images/q504.webp","explanation":"SubVI 將一段可重用程式包成有輸入輸出的單元，對應 C 的函數。"},{"s":4,"n":39,"p":65,"a":0,"q":"LabVIEW 預設的 Data 目錄為下列何者圖示？","o":[],"visual":true,"img":"images/q505.webp","explanation":"Data 預設目錄用於應用產生或讀寫的資料，依原圖中對應資料目錄的圖示選擇。"},{"s":4,"n":40,"p":65,"a":2,"q":"LabVIEW 的預設目錄為下列何者圖示？","o":[],"visual":true,"img":"images/q506.webp","explanation":"LabVIEW 預設目錄常指其安裝相關目錄，圖示辨認應與一般資料目錄、VI 程式庫目錄區分。"},{"s":4,"n":41,"p":65,"a":3,"q":"Vi.lib 的預設目錄為下列何者圖示？","o":[],"visual":true,"img":"images/q507.webp","explanation":"vi.lib 是 LabVIEW 內建 VI 程式庫所在目錄，依原圖辨識其對應的目錄常數圖示。"},{"s":4,"n":42,"p":65,"a":3,"q":"常見的機器人室內定位技術包括 ZigBee 及 Bluetooth，兩者的工作頻率均可設定成？","o":["868 MHz","915 MHz","1830 MHz","2.4 GHz。"],"visual":false,"img":"images/q508.webp","explanation":"Bluetooth 與常見 ZigBee 都可使用 2.4 GHz ISM 頻段，ZigBee 也有其他地區性頻段。"},{"s":4,"n":43,"p":65,"a":2,"q":"藍芽 (Bluetooth) 是一種無線通訊技術，技術始於哪一家公司的 1994 方案？","o":["Sony","Nokia","Ericsson","Intel。"],"visual":false,"img":"images/q509.webp","explanation":"Bluetooth 的早期技術開發源於 Ericsson，名稱之後發展成多廠商標準。"},{"s":4,"n":44,"p":65,"a":0,"q":"WiFi 是一個建立於 IEEE 何種標準下的無線區域網路 (WLAN) 設備？","o":["802.11","802.16","802.13","802.15。"],"visual":false,"img":"images/q510.webp","explanation":"Wi-Fi 的無線區域網路技術以 IEEE 802.11 標準家族為基礎。"},{"s":4,"n":45,"p":65,"a":2,"q":"TTS 技術是哪一種語音訊號處理技術？","o":["音源偵測","聲紋辨識","語音合成","語意分析。"],"visual":false,"img":"images/q511.webp","explanation":"TTS 是 Text-to-Speech，把文字轉成語音，屬語音合成。"},{"s":4,"n":46,"p":66,"a":3,"q":"下列哪個記憶體儲存裝置在電源關閉後記憶體內容不會消失？","o":["RAM","SRAM","DRAM","ROM。"],"visual":false,"img":"images/q512.webp","explanation":"ROM 為非揮發性記憶體，斷電後仍能保留資料，RAM 通常需要供電。"},{"s":4,"n":47,"p":66,"a":0,"q":"電腦的運作核心，負責監督協調主記億體、算術邏輯等各單元的是？","o":["控制單元 (control unit)","算術邏輯單元 (ALU)","記憶體 (memory)","狀態暫存器 (status register)。"],"visual":false,"img":"images/q513.webp","explanation":"控制單元解碼與安排指令，協調記憶體、算術邏輯及其他單元。"},{"s":4,"n":48,"p":66,"a":1,"q":"關於機器人常用的高階與低階電腦程式語言比較，何者正確？","o":["低階語言程式維護比較容易。","低階語言程式執行速度較快。","高階語言程式除錯比較困難。","高階語言程式撰寫比較困難。"],"visual":false,"img":"images/q514.webp","explanation":"題庫採低階語言較接近硬體、可細部控制指令的比較。實際速度也受演算法與編譯最佳化影響。"},{"s":4,"n":49,"p":66,"a":2,"q":"流程圖多用來描述軟體程序，請問方塊、菱形、箭號各在流程圖中代表何種工作？","o":["邏輯狀況、處理步驟、控制流程。","控制流程、邏輯狀況、處理步驟。","處理步驟、邏輯狀況、控制流程。","處理步驟、控制流程、邏輯狀況。"],"visual":true,"img":"images/q515.webp","explanation":"流程圖矩形表示處理步驟，菱形表示條件分支，箭號表示控制流程方向。"},{"s":4,"n":50,"p":66,"a":0,"q":"計算機硬體系統是由下列哪五個基本單元所構成？","o":["算術邏輯單元、記憶單元、控制單元、輸入單元、輸出單元。","數學單元、記憶單元、控制單元、輸入單元、輸出單元。","邏輯電路單元、記憶單元、控制單元、輸入單元、輸出單元。","積體電路單元、記憶單元、控制單元、輸入單元、輸出單元。"],"visual":false,"img":"images/q516.webp","explanation":"五大單元為輸入、輸出、記憶、算術邏輯及控制，分別負責資料進出、保存、運算和指揮。"},{"s":4,"n":51,"p":66,"a":0,"q":"請問下列之記憶體中，何者存取資料之速度最快？","o":["快取記憶體","唯讀記憶體","隨機記憶體","虛擬記憶體。"],"visual":false,"img":"images/q517.webp","explanation":"快取通常位於或靠近 CPU，容量小但存取延遲較低。"},{"s":4,"n":52,"p":66,"a":0,"q":"機器人設計的程式說明文件可用來詳細說明程式的設計方法 、 處理邏輯與輸出入資料格式 ； 在此程式說明文件中，何者對程式設計師最為重要？","o":["程式流程圖","程式碼","程式修改狀況單","機構設計及說明。"],"visual":true,"img":"images/q518.webp","explanation":"流程圖讓人追蹤條件、迴圈與執行順序，可用於理解與檢查程式邏輯。"},{"s":4,"n":53,"p":66,"a":0,"q":"下列何種裝置屬於中央處理單元 (CPU) 中之一部分？","o":["算術邏輯單元 (ALU)","滑鼠 (mouse)","記憶體 (memory)","印表機 (printer)。"],"visual":false,"img":"images/q519.webp","explanation":"ALU 執行算術與邏輯運算，是 CPU 的核心構成之一。"},{"s":4,"n":54,"p":66,"a":3,"q":"交換式電源供應器 (SPS) 的缺點為？","o":["體積大","效率低","輸入電壓範圍小","雜訊大。"],"visual":false,"img":"images/q520.webp","explanation":"開關電源快速切換電流與電壓，會產生紋波和電磁干擾，需濾波及佈線處理。"},{"s":4,"n":55,"p":66,"a":2,"q":"4 位元之 D/A 轉換器，若輸入 11002 時輸出為 4 V，則當輸入多少時，輸出為 1 V？","o":["00012","00102","00112","10012。"],"visual":false,"img":"images/q521.webp","explanation":"1100₂＝12，4 V 降為 1 V 是四分之一，因此輸入碼 12/4＝3＝0011₂。"},{"s":4,"n":56,"p":67,"a":1,"q":"8 位元之 D/A 轉換器，若輸入 011000002 時輸出為 4 V，則當輸入多少時，輸出為 1 V？","o":["010100002","000110002","001110002","000111002。"],"visual":false,"img":"images/q522.webp","explanation":"01100000₂＝96，輸出降為四分之一，輸入碼 96/4＝24＝00011000₂。"},{"s":4,"n":57,"p":67,"a":2,"q":"所謂電池容量即電池所能供應之：","o":["電壓與電流之乘積。","電壓與時間之乘積。","電流與時間之乘積。","電流平方與時間之乘積。"],"visual":false,"img":"images/q523.webp","explanation":"容量 Q＝I×t，常用 Ah 或 mAh 表示，與以 Wh 表示的能量不同。"},{"s":4,"n":58,"p":67,"a":0,"q":"要把溫度感測器測得的類比數值輸入微處理機，會使用？","o":["ADC","DAC","PWM","FM。"],"visual":false,"img":"images/q524.webp","explanation":"ADC 是類比轉數位，把連續電壓轉成可供處理器讀取的數位碼。"},{"s":4,"n":59,"p":67,"a":3,"q":"要把溫度感測器測得的數值輸入微處理機，以下的類比數位轉換器的規格何者有 較好的精密度？","o":["4 bits","8 bits","12 bits","16 bits。"],"visual":false,"img":"images/q525.webp","explanation":"相同輸入範圍下，16 bits 有 65536 個量化階，比較低位元數提供更細的理論解析度，但不等於實際精確度。"},{"s":4,"n":60,"p":67,"a":0,"q":"在群組機器人當中，每一個機器人都應擁有四種能力：通訊、感測、計算和移動，其中 最重要的是？","o":["通訊","感測","計算","移動。"],"visual":false,"img":"images/q526.webp","explanation":"群組協作需要交換位置、任務或狀態資訊，題庫以通訊作為群體合作的關鍵。"},{"s":4,"n":61,"p":67,"a":0,"q":"在機器人操作的過程中，若遇有危險之情形時，宜有一緊急停止裝置來關閉電源，以確保操作員之安全。此種裝置應放置於操作人員易看見且易於使用之處，以確保危急時使用之便利性與時效性。下列何者不是常見之緊急停止裝置？","o":["自動式開關","機械式停止器","極限開關","死人開關。"],"visual":false,"img":"images/q527.webp","explanation":"急停必須能由人員主動且明確觸發，一般自動式開關不能直接等同指定急停裝置。"},{"s":4,"n":62,"p":67,"a":1,"q":"下列何者非保護性停止應具備的主要功能？","o":["移除或控制機器人驅動致動器之動力。","停止功能僅能由控制邏輯啟動。","容許控制任何受機器人控制之危害。","停止所有機器人運動。"],"visual":false,"img":"images/q528.webp","explanation":"保護性停止須能由適當的防護裝置或安全功能觸發，不能限制為只有一般控制邏輯能啟動。"},{"s":4,"n":63,"p":67,"a":0,"q":"關於機器人之緊急停止裝置，何者敘述為錯誤？","o":["緊急停止裝置用開關 ， 應為易操作之構造 ， 且應設在易操作之位置 ， 並應設置黑色標示。","緊急停止裝置用開關，其四周不得設置可能發生錯誤操作之其他開關。","緊急停止裝置用開關以外之開關，通常設置護圈或為埋頭型。","因緊急停止裝置動作致機器人停止運轉後再起動前，確認異常狀況解除及確認安全之方法。"],"visual":false,"img":"images/q529.webp","explanation":"緊急停止致動器一般採紅色並搭配黃色背景，黑色標示不符合此識別方式。"},{"s":4,"n":64,"p":67,"a":0,"q":"機器人系統應具有幾個以上保護性停止電路設計， 用於連接外部保護裝置？","o":["1","2","3","4 個。"],"visual":false,"img":"images/q530.webp","explanation":"題庫要求至少一個保護性停止電路介面，供外部防護裝置連接，實際電路架構依風險等級設計。"},{"s":4,"n":65,"p":68,"a":1,"q":"有關死人開關之敘述，下列敘述何者正確？","o":["死人開關是一種可以讓設備自我毁滅的開關。","死人開關是將開關設計為按鈕按下時，機器人才會有動作的操作方式。","死人開關是將開關設計為按鈕按下時，機器人會立即停止動作的操作方式。","沒有這種開關名稱。"],"visual":false,"img":"images/q531.webp","explanation":"致能或死人開關需持續施加指定操作才能允許動作，放開時停止允許訊號。部分設備採三段式以兼顧驚慌時過度握緊。"},{"s":4,"n":66,"p":68,"a":3,"q":"機器人在生產自動化過程中，扮演著相當重要的角色。機器人意外事故的發生，可歸納區分的類別不包括下列哪一項？","o":["在機器人的可動範圍之內被機器人的移動件撞擊。","被機器人掉落或是噴射出的物件 (物體飛射) 或工具撞擊。","在機器人的可動範圍之內或是其附近區域 ， 被陷入在機器人的移動件和其他機械或物件之中。","機器人因故障而無法執行特定功能。"],"visual":false,"img":"images/q532.webp","explanation":"設備故障造成無法執行功能屬失效，未必已構成人員傷害事故，題庫在此區分故障與意外事故。"},{"s":4,"n":67,"p":68,"a":2,"q":"每一個機器人都應具有一個以上獨立的緊急停止功能，下列何者並不是緊急停止功能？","o":["優先順序高於其他機器人控制方式","維持動作直到重置為止","要能以手動及自動方式重置","移除機器人致動器之驅動動力。"],"visual":false,"img":"images/q533.webp","explanation":"解除緊急停止應採刻意的手動重置，且重置本身不能直接重新啟動危險動作。"},{"s":4,"n":68,"p":68,"a":2,"q":"下圖以布林 (Boolean) 代數式表示為？","o":["F = A．B","F = A + B","F = A⊕B","F=A⊙B。"],"visual":true,"img":"images/q534.webp","explanation":"XOR 在兩輸入相異時輸出 1，符號為 A⊕B，輸入 00、11 時輸出 0。"},{"s":4,"n":69,"p":68,"a":0,"q":"下圖以布林 (Boolean) 代數式表示為？","o":["F = A + B","F = A．B","F = A⊕B","F=A⊙B。"],"visual":true,"img":"images/q535.webp","explanation":"OR 只要至少一個輸入為 1 就輸出 1，布林式 A＋B。"},{"s":4,"n":70,"p":68,"a":1,"q":"下圖以布林 (Boolean) 代數式表示為？","o":["F = A⊕B","F = A．B","F = A + B","F=A⊙B。"],"visual":true,"img":"images/q536.webp","explanation":"AND 要兩個輸入都為 1 才輸出 1，布林式 A·B。"},{"s":4,"n":71,"p":68,"a":1,"q":"下列哪個軟體是常見的機器人軟體程式開發的版本控制系統？","o":["Photoshop","Git","Unity","Excel。"],"visual":false,"img":"images/q537.webp","explanation":"Git 保存版本與提交歷史，可比較、合併和回復程式變更。"},{"s":4,"n":72,"p":68,"a":0,"q":"下列哪個軟體是常見的建立與管理機器人關聯式資料庫的工具？","o":["MySQL","Photoshop","Illustrator","Eclipse。"],"visual":false,"img":"images/q538.webp","explanation":"MySQL 為關聯式資料庫管理系統，以資料表與 SQL 儲存和查詢資料。"},{"s":4,"n":73,"p":69,"a":2,"q":"ROS 機器人操作系統是下列何者的縮寫？","o":["Router Operating System","Request Of Service","Robot Operating System","Reactive Oxygen Species。"],"visual":false,"img":"images/q539.webp","explanation":"ROS 展開為 Robot Operating System，提供機器人軟體整合與通訊工具。"},{"s":4,"n":74,"p":69,"a":3,"q":"下列何者不是選擇 ROS (Robot Operating System)進行機器人系統開發的考量因素？","o":["提供一個標準化軟體通信機制，提升程式碼重複利用的可能性。","透過開源授權，不同開發者可以共享社群成果，提供多樣化的學習資源和研發成果。","ROS 適用於各種機器人應用，從室內到室外、家庭到汽車、水下到太空、消費者到工業均可。","可直接全盤引用他人的成果，不必自行設計和開發，就可以推出產品販售。"],"visual":true,"img":"images/q540.webp","explanation":"使用開源元件仍需整合、測試與符合授權，不能假設直接全盤引用就能完成商業產品。"},{"s":4,"n":75,"p":69,"a":1,"q":"下列對於 ROS (Robot Operating System)機器人操作系統的敘述，何者錯誤？","o":["提供一個標準化軟體通信機制，縮減機器人開發時程。","只能支援 Python 程式語言開發機器人功能。","ROS 適用於各種機器人應用，從室內到室外、家庭到汽車、水下到太空、消費者到工業均可。","可提升不同廠家機器人的整合性。"],"visual":false,"img":"images/q541.webp","explanation":"ROS 提供 C++、Python 等客戶端函式庫，因此只支援 Python 的敘述錯誤。","source":"https://github.com/ros"},{"s":4,"n":76,"p":69,"a":0,"q":"電腦作業系統負責管理與分配電腦硬體資源、監控應用軟體的運作狀況並提供使用者親善的存取介面。ROS (Robot Operating System) 機器人操作系統也具有類似的機制，只是管理對象為機器人相關軟硬體。請問下列何者是 ROS 機器人操作系統管理的裝置或設備？","o":["光達 (LiDAR)","CPU 中央處理器","記憶體","儲存裝置的存取。"],"visual":false,"img":"images/q542.webp","explanation":"LiDAR 是可由 ROS 驅動節點讀取與發布資料的機器人感測設備。"},{"s":4,"n":77,"p":69,"a":3,"q":"OpenCV 電腦視覺開源程式庫是目前智慧機器人領域中，最常被廣泛使用的影像辨識或視覺式同步定位建圖軟體框架，下列何者非常見之應用？","o":["物件方位辨識","移動路徑規劃","機器人定位","判斷工件的軟硬度。"],"visual":false,"img":"images/q543.webp","explanation":"一般相機只取得外觀影像，軟硬度需要力學接觸或另外的感測與推論條件。"},{"s":4,"n":78,"p":69,"a":3,"q":"PyTorch 深度學習開源程式庫是目前智慧機器人領域中 ， 最常被廣泛使用的人工智慧軟體框架，下列何者非常見之應用？","o":["物件方位辨識","動態物體辨識與避障","生成式人機互動交談","判斷工件的軟硬度。"],"visual":false,"img":"images/q544.webp","explanation":"PyTorch 提供模型訓練與推論能力，但僅有影像並不能直接可靠測出材質軟硬度，需適當資料和感測。"},{"s":4,"n":79,"p":69,"a":3,"q":"ROS 提供了類似作業系統的特性、共通的機器人軟體平台、統一的資訊傳輸框架；支援多種程式語言 、 提供視覺化模擬工具 ； 內建多種通用演算法 、 提供各種感測 、 運動控制 、 空間地圖 、導航路徑規劃等功能 ； 有大量網路社群與論壇支援 、 有眾多第三方程式庫 。 以上對於ROS 的描述可歸納為下咧那些特性的組合？","o":["Plumbing 通信機制 + Tools 開發工具","Tools 開發工具 + Capability 應用功能","Capability 應用功能 + Community 社群生態系統","Plumbing 通信機制 + Tools  開發工具 + Capability 應用功能 + Community 社群生態系統。"],"visual":false,"img":"images/q545.webp","explanation":"ROS 包含節點通訊、開發工具、應用能力與社群支援，四項皆屬其生態系統的特性。"},{"s":4,"n":80,"p":69,"a":0,"q":"下列何者為在 ROS 中整理及組織軟體的主要單元，是開發者能建立及分享的最小單元？","o":["套件 Package","節點 Node","話題 Topic","訊息 Message。"],"visual":false,"img":"images/q546.webp","explanation":"Package 整理程式、設定與相依關係，是 ROS 功能發布和重用的基本單元。"},{"s":4,"n":81,"p":70,"a":1,"q":"在 Ubuntu 中複製 (copy) 檔案的命令列指令為下列何者？","o":["ls","cp","mkdir","cd。"],"visual":false,"img":"images/q547.webp","explanation":"cp 是 copy 的縮寫，用於複製檔案或目錄。"},{"s":4,"n":82,"p":70,"a":2,"q":"在 Ubuntu 中搬移 (move) 檔案的命令列指令為下列何者？","o":["ls","mkdir","mv","cd。"],"visual":false,"img":"images/q548.webp","explanation":"mv 是 move 的縮寫，可移動檔案，也可在同目錄重新命名。"},{"s":4,"n":83,"p":70,"a":1,"q":"在 Ubuntu 中建立目錄 (make directory) 的命令列指令為下列何者？","o":["ls","mkdir","mv","pwd。"],"visual":false,"img":"images/q549.webp","explanation":"mkdir 是 make directory，建立新的目錄。"},{"s":4,"n":84,"p":70,"a":3,"q":"在 Ubuntu 中顯示目前所在目錄 (print name of current/working directory) 的命令列指令為下列何者？","o":["ls","mkdir","mv","pwd。"],"visual":false,"img":"images/q550.webp","explanation":"pwd 是 print working directory，印出目前所在目錄路徑。"},{"s":4,"n":85,"p":70,"a":1,"q":"在 Ubuntu 中移動 (change directory)至上一層目錄的命令列指令為下列何者？","o":["cd .","cd ..","cd ~","cd /。"],"visual":false,"img":"images/q551.webp","explanation":"cd 切換目錄，.. 代表父目錄，所以 cd .. 移到上一層。"},{"s":4,"n":86,"p":70,"a":0,"q":"在 Ubuntu 中取得暫時管理權限 (superuser do) 的命令列指令為下列何者？","o":["sudo","apt update","apt upgrade","su。"],"visual":false,"img":"images/q552.webp","explanation":"sudo 依授權規則以其他使用者身分執行命令，常用於暫時取得管理權限。"},{"s":4,"n":87,"p":70,"a":2,"q":"在 C/C++ 程式語言中，宣告一個整數資料型別變數 num 的指令為下列何者？","o":["float num;","int num[];","int num;","double num;。"],"visual":false,"img":"images/q553.webp","explanation":"int 是整數型別，int num; 宣告名為 num 的整數變數。"},{"s":4,"n":88,"p":70,"a":0,"q":"在 C/C++ 程式語言中，宣告一個單精度浮點數資料型別變數 num 的指令為下列何者？","o":["float num;","int num[];","int num;","double num;。"],"visual":false,"img":"images/q554.webp","explanation":"float 是單精度浮點型別，常見為 32 位元，可表達小數但存在捨入誤差。"},{"s":4,"n":89,"p":70,"a":3,"q":"在 C/C++ 程式語言中，宣告一個倍精度浮點數資料型別變數 num 的指令為下列何者？","o":["float num;","int num[];","int num;","double num;。"],"visual":false,"img":"images/q555.webp","explanation":"double 是倍精度浮點型別，常見為 64 位元，比 float 有更多有效位數。"},{"s":4,"n":90,"p":70,"a":1,"q":"在 C/C++ 程式中的單行註解文字使用下列何種符號註記？","o":["///","//","#","/**。"],"visual":false,"img":"images/q556.webp","explanation":"// 後直到該行結束的內容是 C/C++ 單行註解。"},{"s":4,"n":91,"p":70,"a":3,"q":"程式碼錯誤的情況有兩種，其一為違反程式語言規則的語法錯誤(syntax error)，另一種為語意錯誤(semantic error)，即程式的執行結果錯誤，不為預期的結果，但不違反語法規則。請問下列那項不會導致 C++ 編譯器報告語法錯誤？","o":["未匹配的一組左右大括號 {  }","註解文字少了 */ 符號","在程式敘述後少了分號 ;","多餘的空白行。"],"visual":true,"img":"images/q557.webp","explanation":"多餘空白行一般不改變 C++ 的語法結構，編譯器會忽略不具語義的空白。"},{"s":4,"n":92,"p":70,"a":2,"q":"在 python 程式中的單行註解文字使用下列何種符號註記？","o":["///","//","#","/**。"],"visual":false,"img":"images/q558.webp","explanation":"Python 使用 # 開始單行註解，字串中的 # 則屬字串內容。"},{"s":4,"n":93,"p":71,"a":0,"q":"虛擬碼(Pseudo-code)通常只描述動作(action)，而不包括下列何者：","o":["宣告 Declarations","輸入輸出 Input/output","演算法 Algorithms","控制結構 Control structures。"],"visual":false,"img":"images/q559.webp","explanation":"虛擬碼著重演算法動作與流程，通常省略特定語言的型別宣告細節。"},{"s":4,"n":94,"p":71,"a":2,"q":"在 C++ 程式中，請問以下哪一項不是語法錯誤？？","o":["std::cout  \u003c\u003c  'Hello world! ';","std::cout  \u003c\u003c  \"Hello                                       world! \";","std::cout  \u003c\u003c  \"Hello world! \";","std::cout  \u003c\u003c  Hello world!;"],"visual":true,"img":"images/q560.webp","explanation":"C 使用雙引號包住完整字串，並以分號結束敘述。單引號並非一般字串寫法，直接換行也需合法字串語法。"},{"s":4,"n":95,"p":71,"a":3,"q":"以下何者不是命名 C++ 識別字時可使用的字元？","o":["數字 0~9","大小寫英文字母 a~zA~Z","底線符號 _","金錢符號 $。"],"visual":false,"img":"images/q561.webp","explanation":"標準 C++ 識別字可使用字母、數字及底線等，數字不能位於開頭。$ 不是可攜的標準基本識別字字元。"},{"s":4,"n":96,"p":71,"a":2,"q":"假設在當前目錄下找到 GradeBook.h，在 C++標準函式庫文件目錄下找到 iostream 標頭檔，下面哪個預處理器指令會找不到它想要的標頭檔文件？","o":["#include \u003ciostream>","#include \"iostream\"","#include \u003cGradeBook.h>","#include \"GradeBook.h\"。"],"visual":true,"img":"images/q562.webp","explanation":"尖括號通常從設定的系統標頭路徑搜尋，雙引號通常先搜尋目前檔案附近。題目限定 GradeBook.h 只在當前目錄，因此選尖括號的該項。"}]</script>
<script>
'use strict';
const bank=JSON.parse(document.getElementById('bank').textContent);
const chapters=['一般概念','機構和電機','感測系統','馬達和運動控制','軟體程式和其他'];
const letters='ABCD',ids=bank.map((_,i)=>i),el=id=>document.getElementById(id),key='tw.robot.115.0827.practice.v1';
const modes={seq:'依題號練習',random:'隨機練習',quick:'自選題數',wrong:'錯題重練',show:'直接顯示答案'};
el('section').add(new Option('全部單元（563 題）','all'));
chapters.forEach((c,i)=>el('section').add(new Option(c+'（'+bank.filter(q=>q.s===i).length+' 題）',i)));
const makeRun=(order,scope,mode)=>({order,scope,mode,at:0,picks:{},end:false,startedAt:Date.now(),timing:{},opened:{}});
let records={},history={},run=makeRun(ids.slice(),'all','seq'),saveOK=true;
try{
 const saved=JSON.parse(localStorage.getItem(key)||'null');
 if(saved && saved.run.order.length && saved.run.order.every(i=>!!bank[i]) && saved.run.at>=0 && saved.run.at<saved.run.order.length){run=saved.run;history=saved.history||{};records=saved.records||{}}
}catch(e){saveOK=false}
run.timing=run.timing||{};run.opened=run.opened||{};
for(const [id,timing] of Object.entries(run.timing)){
 if(!records[id]&&Number.isFinite(timing.elapsed))records[id]={fastest:timing.elapsed,slowest:timing.elapsed,count:1};
}
const stamp=value=>new Date(value).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
function duration(ms){const seconds=Math.max(0,Math.round(ms/1000));return Math.floor(seconds/3600)+' 時 '+Math.floor(seconds%3600/60)+' 分 '+seconds%60+' 秒';}
function save(){try{localStorage.setItem(key,JSON.stringify({history,run,records}));saveOK=true}catch{saveOK=false}}
let pendingSave;
function persist(){draw();clearTimeout(pendingSave);pendingSave=setTimeout(save,250)}
window.addEventListener('pagehide',save);
function updateCount(){const total=bank.filter(q=>el('section').value==='all'||q.s===Number(el('section').value)).length;el('countSetting').hidden=el('mode').value!=='quick';el('count').max=total;el('countHint').textContent='目前範圍最多 '+total+' 題';}
function begin(order,scope,mode){run=makeRun(order,scope,mode);el('section').value=scope;el('mode').value=mode;updateCount();persist()}
function start(){
 const scope=el('section').value,mode=el('mode').value;
 if(mode==='quick'&&!el('count').reportValidity())return;
 const order=ids.filter(i=>(scope==='all'||bank[i].s===Number(scope))&&(mode!=='wrong'||history[i]===false));
 if(!order.length){el('status').textContent='這個範圍目前沒有待複習的錯題。';return}
 if(mode==='random'||mode==='quick'){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
 if(mode==='quick')order.splice(Number(el('count').value));
 begin(order,scope,mode);
}
function move(to){if(to<0||to>=run.order.length)return;run.at=to;run.end=false;persist();el('stem').focus({preventScroll:true})}
function answer(k){const id=run.order[run.at];if(run.mode==='show'||run.end||Object.hasOwn(run.picks,id))return;const now=Date.now();run.timing[id]={at:now,elapsed:now-(run.opened[id]||now)};const elapsed=run.timing[id].elapsed;const record=records[id];records[id]={fastest:record?Math.min(record.fastest,elapsed):elapsed,slowest:record?Math.max(record.slowest,elapsed):elapsed,count:(record?record.count:0)+1};run.picks[id]=k;if(Object.keys(run.picks).length===run.order.length&&!run.finishedAt)run.finishedAt=now;history[id]=k===bank[id].a;persist()}
function next(){if(run.mode==='show'&&run.at===run.order.length-1){move(0);return}if(run.at<run.order.length-1){move(run.at+1)}else{run.end=true;persist()}}
function showOriginal(){const q=bank[run.order[run.at]];el('caption').textContent=chapters[q.s]+' · 第 '+q.n+' 題 · PDF 第 '+q.p+' 頁';el('full').src=q.img;el('modal').showModal()}
function shortTime(ms){return (ms/1000).toFixed(1)+' 秒';}
function extremes(){const entries=run.order.filter(id=>run.timing[id]).map(id=>({id,...run.timing[id]}));if(!entries.length)return '本輪尚無單題耗時紀錄。';const fastest=entries.reduce((a,b)=>a.elapsed<=b.elapsed?a:b),slowest=entries.reduce((a,b)=>a.elapsed>=b.elapsed?a:b);const label=e=>chapters[bank[e.id].s]+' 第 '+bank[e.id].n+' 題（'+shortTime(e.elapsed)+'）';return '本輪單題最快　'+label(fastest)+'　／　最慢　'+label(slowest);}
function updateTotalTime(){el('totalTime').textContent=run.mode==='show'?'閱覽模式':run.startedAt?duration((run.finishedAt||Date.now())-run.startedAt):'舊紀錄無計時';}
setInterval(updateTotalTime,1000);
function draw(){
 updateTotalTime();
 const {order,at,picks}=run,id=order[at],q=bank[id],pick=picks[id],showAnswer=run.mode==='show',answered=showAnswer||pick!==undefined;
 el('status').textContent=saveOK?'進度會儲存在這個瀏覽器。':'瀏覽器未開放儲存，本次仍可練習。';
 el('seen').textContent=Object.keys(history).length+' / 563';el('miss').textContent=Object.values(history).filter(x=>x===false).length+' 題';
 el('task').hidden=run.end;el('result').hidden=!run.end;
 if(run.end){
   const done=Object.keys(picks).length,correct=order.filter(i=>picks[i]===bank[i].a).length;
   el('score').textContent='答對 '+correct+' 題，答錯 '+(done-correct)+' 題，未答 '+(order.length-done)+' 題。'+(done?'已答題正確率 '+Math.round(100*correct/done)+'%。':'');
   el('runTime').textContent=(run.finishedAt?'完成時間 '+stamp(run.finishedAt):'本輪尚未全部作答')+(run.startedAt?'　／　本輪耗時 '+duration((run.finishedAt||Date.now())-run.startedAt):'　／　舊進度沒有起始時間紀錄');
   el('extremes').textContent=extremes();
   el('retry').hidden=done===correct;el('resume').hidden=done===order.length;return;
 }
 if(!showAnswer&&!answered&&!run.opened[id])run.opened[id]=Date.now();
 el('answerTime').hidden=!answered||showAnswer;const timing=run.timing[id];el('answerTime').textContent=timing?'作答時間 '+stamp(timing.at)+'　／　本題耗時 '+shortTime(timing.elapsed):'此題為舊進度，沒有作答時間紀錄。';
 if(timing&&records[id])el('answerTime').textContent+='　／　此題歷次最快 '+shortTime(records[id].fastest)+'、最慢 '+shortTime(records[id].slowest)+'（'+records[id].count+' 次）';
 el('reference').hidden=!q.source;el('reference').href=q.source||'#';
 el('session').textContent=modes[run.mode];el('counter').textContent=(at+1)+' / '+order.length;
 el('bar').style.width=100*(showAnswer?at+1:Object.keys(picks).length)/order.length+'%';
 el('chapter').textContent=chapters[q.s]+'　／　原題 '+q.n;
 el('stem').textContent=q.visual?'依原題選出答案':q.q;
 el('figure').hidden=!q.visual;
 if(q.visual){if(el('fig').dataset.question!==String(id)){el('fig').src=q.img;el('fig').dataset.question=String(id);}el('fig').alt=q.q||'官方題目與四個選項'}
 el('source').textContent=q.visual?'放大原題':'查看原題';
 const list=el('choices');list.replaceChildren();list.classList.toggle('compact',q.visual);
 for(let i=0;i<4;i++){
    const btn=document.createElement('button'),badge=document.createElement('span');btn.className='choice';badge.className='letter';badge.textContent=letters[i];btn.append(badge);
    if(!q.visual)btn.append(document.createTextNode(q.o[i]));else if(q.o[i])btn.setAttribute('aria-label',letters[i]+' '+q.o[i]);
    btn.disabled=answered;btn.onclick=()=>answer(i);
    if(answered&&(i===q.a||i===pick)){const good=i===q.a,mark=document.createElement('em');btn.classList.add(good?'ok':'err');mark.textContent=good?'正解':'你的答案';btn.append(mark)}
    list.append(btn)
 }
 el('feedback').classList.toggle('bad',answered&&!showAnswer&&pick!==q.a);el('feedback').textContent=showAnswer?'正確答案是 '+letters[q.a]+'。':answered?(pick===q.a?'答對了！':'答錯了。正確答案是 '+letters[q.a]+'。'):'';
 el('explanation').hidden=!answered;el('reason').textContent=answered?q.explanation:'';
 el('prev').disabled=at===0;el('next').textContent=at===order.length-1?(showAnswer?'回到第一題':'查看本輪成績'):'下一題 →';el('jump').max=order.length;el('jump').value=at+1;
}
el('reset').onclick=()=>{if(!confirm('確定要清除所有作答紀錄、錯題和本輪進度嗎？'))return;clearTimeout(pendingSave);history={};records={};el('section').value='all';el('mode').value='seq';el('count').value=20;begin(ids.slice(),'all','seq');save();};
el('start').onclick=start;el('prev').onclick=()=>move(run.at-1);el('next').onclick=next;
el('go').onclick=()=>{if(el('jump').value&&el('jump').reportValidity())move(Number(el('jump').value)-1)};
el('jump').onkeydown=e=>{if(e.key==='Enter')el('go').click()};
el('retry').onclick=()=>begin(run.order.filter(i=>Object.hasOwn(run.picks,i)&&run.picks[i]!==bank[i].a),run.scope,'wrong');
el('resume').onclick=()=>move(run.order.findIndex(i=>!Object.hasOwn(run.picks,i)));
el('review').onclick=()=>move(0);el('source').onclick=el('figure').onclick=showOriginal;el('close').onclick=()=>el('modal').close();
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||e.repeat||el('modal').open||run.end||/INPUT|SELECT/.test(e.target.tagName))return;
 if(/^[1-4]$/.test(e.key))answer(Number(e.key)-1);else if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();move(run.at-1)}
});
el('section').onchange=el('mode').onchange=updateCount;
el('section').value=run.scope;el('mode').value=run.mode;if(run.mode==='quick')el('count').value=run.order.length;updateCount();draw();
</script></html>
